<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#075B42">
<title>SUNLIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --green:#075B42; --green-d:#054733; --gold:#F5C542; --gold-s:rgba(245,197,66,.22);
  --bg:#fff; --text:#17231F; --muted:#6B7A74; --line:#EAF0ED; --soft:#F4F8F6; --blue:#2F9BFF;
  --shadow:0 6px 20px rgba(7,91,66,.16); --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:#E9EFEC;color:var(--text);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:0;background:none}
ul{list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;overflow:clip;box-shadow:0 0 40px rgba(0,0,0,.12)}   /* clip: can never be scrolled sideways by focus() / scrollIntoView() */

/* header */
.top{position:relative;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;height:42px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--gold);font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo i{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.06em}
.top-actions{display:flex;gap:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:inherit;transition:background .2s,transform .15s}
.icon-btn:active{background:rgba(255,255,255,.16);transform:scale(.92)}
.icon-btn.small{width:32px;height:32px;font-size:15px}
.icon-btn.light{color:#fff}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;color:var(--text);border-radius:14px;padding:0 6px 0 14px;height:0;opacity:0;overflow:hidden;margin-top:0;transition:height .25s,opacity .25s,margin .25s}
.searchbar.open{height:44px;opacity:1;margin-top:10px}
.searchbar i{color:var(--muted);font-size:14px}
.searchbar input{flex:1;min-width:0}
.searchbar .icon-btn{color:var(--muted)}
.dropdown{position:absolute;right:12px;top:calc(54px + env(safe-area-inset-top,0px));width:210px;background:#fff;color:var(--text);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.22);opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:.18s}
.dropdown.open{opacity:1;transform:none;pointer-events:auto}
.dropdown li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-weight:500;cursor:pointer}
.dropdown li i{width:18px;color:var(--green);text-align:center}
.dropdown li:active,.dropdown li:hover{background:var(--soft)}

/* main + views */
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:96px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{display:none}
.view.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.title{font-size:24px;font-weight:800;padding:18px 16px 8px}
.sub{font-size:13px;font-weight:600;color:var(--muted);padding:14px 16px 6px}

/* tabs */
.tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 16px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.25s}
.tab.active{background:var(--green);color:#fff}
.tab.active::after{content:"";position:absolute;left:50%;bottom:-3px;width:18px;height:3px;border-radius:3px;background:var(--gold);transform:translateX(-50%)}
.pill{background:var(--gold);color:var(--text);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;place-items:center;padding:0 5px}
.pill.show{display:grid}

/* stories */
.stories{display:flex;gap:14px;padding:14px 14px 10px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 64px;text-align:center;font-size:12px;font-weight:500}
.story .avatar{margin:0 auto 6px}
.story span.n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{border:2px solid var(--green);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold);margin:4px}
.ring.seen{border-color:#CBD6D1;box-shadow:0 0 0 2px #fff,0 0 0 4px #E3EAE7}
.add-badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--green-d);border:2px solid #fff;display:grid;place-items:center;font-size:10px}

/* avatar */
.avatar{position:relative;width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.big{width:64px;height:64px;font-size:24px}
.avatar .dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#2DCB73;border:2.5px solid #fff}

/* rows */
.row{display:flex;align-items:center;gap:13px;padding:11px 16px;cursor:pointer;transition:background .15s;animation:fade .3s ease both}
.row:active{background:var(--soft)}
.row .body{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:-11px;padding-top:0}
.row:last-child .body{border-bottom:0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.line strong{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:12px;color:var(--muted);flex:none}
.time.new{color:var(--green);font-weight:600}
.preview{color:var(--muted);font-size:14px;margin-top:3px;display:flex;align-items:center;gap:5px;min-width:0}
.preview .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview .grow{flex:1;min-width:0;display:flex;align-items:center;gap:5px}
.tick{font-size:12px;color:#9AA8A2;flex:none}
.tick.read{color:var(--blue)}
.badge{background:var(--green);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex:none}
.fav-ico{color:var(--gold);font-size:12px}
.missed strong,.missed .txt{color:#D64545}
.call-btn{color:var(--green);font-size:17px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.empty{text-align:center;color:var(--muted);padding:48px 24px}
.empty i{font-size:30px;color:var(--gold);margin-bottom:12px;display:block}

/* updates / settings */
.my-status{display:flex;align-items:center;gap:13px;padding:8px 16px}
.my-status p,.profile-card p{color:var(--muted);font-size:13px;margin-top:2px}
.profile-card{display:flex;align-items:center;gap:14px;margin:6px 16px 10px;padding:16px;border-radius:var(--r);background:var(--soft)}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.set-row:active{background:var(--soft)}
.set-ico{width:36px;height:36px;border-radius:11px;background:var(--gold-s);color:var(--green);display:grid;place-items:center;font-size:15px}
.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* fab */
.fab{position:absolute;right:18px;bottom:88px;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:21px;display:grid;place-items:center;box-shadow:var(--shadow);border:3px solid var(--gold);z-index:15;transition:transform .2s,opacity .2s}
.fab:active{transform:scale(.9)}
.fab.hide{transform:scale(0);opacity:0;pointer-events:none}

/* bottom nav */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(23,35,31,.06);z-index:16}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);transition:color .2s}
.nav-ico{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:16px;transition:background .25s}
.nav-item.active{color:var(--green);font-weight:700}
.nav-item.active .nav-ico{background:var(--gold-s)}

/* overlay screens */
.screen{position:absolute;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.3,.8,.3,1),visibility .3s}
.screen.open{transform:none;visibility:visible}
.screen-head{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 10px 6px;min-height:62px}
.screen-head strong{display:block;font-size:17px;font-weight:600}
.screen-head small{display:block;font-size:12px;opacity:.8;margin-top:1px}
.screen-head .grow{flex:1;min-width:0}
.screen > .chat-list,.screen > .sub{flex:none}
#newChat{overflow:hidden}
.quick button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;font-weight:600;text-align:left}
.quick button:active{background:var(--soft)}
.q-ico{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--green-d);display:grid;place-items:center}

/* conversation */
.chat-screen{background:#F3F1EA}
.messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:#fff;color:var(--muted);font-size:12px;font-weight:500;padding:5px 12px;border-radius:10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg{max-width:80%;padding:8px 12px 6px;border-radius:14px;font-size:15px;line-height:1.4;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.07);animation:pop .22s ease both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.msg.in{align-self:flex-start;background:#fff;border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:#D5EBDD;border-top-right-radius:4px}
.msg small{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:2px}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA8A2;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-4px)}}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.composer .icon-btn{color:var(--muted);flex:none;margin-bottom:2px}
.composer textarea{flex:1;min-width:0;height:44px;max-height:120px;background:var(--soft);border-radius:22px;padding:12px 16px;line-height:1.3;font-size:15px;resize:none}
.send{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:16px;flex:none;transition:transform .15s}
.send:active{transform:scale(.9)}
.send.mic{background:var(--gold);color:var(--green-d)}
#chatName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* chat bubbles: grouping, media, voice, replies */
.msg{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.msg.grp{margin-top:-3px}
.msg.failed{background:#FCE9E9}
.msg.flash{animation:flash 1.1s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:0 1px 2px rgba(0,0,0,.07)}}
.msg .cap{margin-top:4px}
.msg .del{color:var(--muted);font-style:italic;font-size:14px}
.msg .retry{font-size:12px;font-weight:600;color:#D64545;margin-top:4px}
.tick.fail{color:#D64545}
.msg.media-only{padding:4px 4px 5px}
.msg.media-only small{padding:0 6px}
.quote{display:block;background:rgba(7,91,66,.08);border-left:3px solid var(--green);border-radius:8px;padding:5px 9px;margin:0 0 6px;font-size:13px;cursor:pointer;min-width:120px}
.msg.out .quote{background:rgba(7,91,66,.13)}
.quote strong{display:block;color:var(--green);font-size:12px;font-weight:700}
.quote span{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.img-wrap{position:relative;width:min(240px,62vw);aspect-ratio:4/3;border-radius:10px;overflow:hidden;cursor:pointer;background:linear-gradient(90deg,#E9EFEC 25%,#F4F8F6 37%,#E9EFEC 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
.img-wrap img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.img-wrap.loaded{animation:none;background:#E9EFEC}
.img-wrap.loaded img{opacity:1}
.img-wrap.err{animation:none;display:grid;place-items:center;color:var(--muted);font-size:13px}
.img-wrap.err::after{content:"Tap to retry"}
.voice{display:flex;align-items:center;gap:10px;min-width:200px}
.v-play{width:38px;height:38px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;font-size:14px}
.v-track{flex:1;height:26px;display:flex;align-items:center;cursor:pointer}
.v-bar{position:relative;width:100%;height:5px;border-radius:3px;background:rgba(7,91,66,.2)}
.v-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--green)}
.v-fill::after{content:"";position:absolute;right:-5px;top:-3px;width:11px;height:11px;border-radius:50%;background:var(--green);opacity:0}
.voice.on .v-fill::after{opacity:1}
.v-time{font-size:12px;color:var(--muted);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.to-bottom{position:absolute;right:14px;bottom:84px;width:40px;height:40px;border-radius:50%;background:#fff;color:var(--green);box-shadow:0 3px 12px rgba(0,0,0,.2);display:grid;place-items:center;z-index:5}
.reply-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:#fff;border-top:1px solid var(--line)}
.rb-body{flex:1;min-width:0;border-left:3px solid var(--green);padding-left:10px}
.rb-body strong{display:block;font-size:12px;color:var(--green)}
.rb-body span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-bar{display:flex;align-items:center;gap:12px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.rec-bar .icon-btn{color:#D64545}
.rec-dot{width:11px;height:11px;border-radius:50%;background:#D64545;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.rec-hint{flex:1;color:var(--muted);font-size:14px}
#recTime{font-variant-numeric:tabular-nums;min-width:38px}

/* sheets, lightbox, photo preview */
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fade .2s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:22px 22px 0 0;padding:10px 8px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:rise .22s ease}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#D8E2DD;margin:0 auto 8px}
.sheet button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:12px;font-weight:600;text-align:left}
.sheet button:active{background:var(--soft)}
.sheet .s-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--gold-s);color:var(--green);flex:none}
.sheet .danger{color:#D64545}
.sheet .danger .s-ico{background:#FCE9E9;color:#D64545}
.lightbox,.imgprev{position:absolute;inset:0;z-index:60;background:rgba(5,15,12,.95);display:flex;flex-direction:column;animation:fade .2s ease}
.lb-top{display:flex;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
.lb-top .icon-btn,.lb-top a{color:#fff;width:44px;height:44px;display:grid;place-items:center;font-size:18px;border-radius:50%}
.lightbox img,.imgprev img{flex:1;min-height:0;max-width:100%;object-fit:contain;margin:auto}
.ip-bar{display:flex;align-items:center;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.ip-bar input{flex:1;min-width:0;background:rgba(255,255,255,.12);color:#fff;border-radius:22px;padding:12px 16px}
.ip-bar input::placeholder{color:rgba(255,255,255,.6)}
.preview .txt i{margin-right:4px;font-size:12px}

/* new chat: search + contacts */
.ns-wrap{flex:none;padding:12px 14px 8px;background:#fff;border-bottom:1px solid var(--line)}
.ns-bar{display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 15px;border-radius:16px;background:var(--soft);border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s,background .2s}
.ns-bar:focus-within{background:#fff;border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-s)}
.ns-bar>i{color:var(--green);font-size:14px}
.ns-bar input{flex:1;min-width:0;height:100%;font-size:15px}
.ns-bar input:focus-visible{outline:0}
.ns-bar input::placeholder{color:#8E9C96}
.ns-bar input::-webkit-search-cancel-button,.ns-bar input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.ns-spin{display:none;flex:none;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green);animation:rot .7s linear infinite}
.ns-bar.loading .ns-spin{display:block}
.ns-clear{color:var(--muted)}
.ns-body{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px}
.on{color:var(--green);font-weight:600}
mark{background:var(--gold-s);color:inherit;border-radius:3px;padding:0 1px}
.act-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:17px;font-size:13px;font-weight:700;transition:transform .15s,background .2s,color .2s}
.act-btn:active{transform:scale(.94)}
.act-btn:disabled{opacity:.7;cursor:default}
.act-btn.add{background:var(--gold);color:var(--green-d);box-shadow:0 2px 8px var(--gold-s)}
.act-btn.added{background:var(--soft);color:var(--green);opacity:1}
.act-btn.rm{width:38px;height:38px;padding:0;justify-content:center;border-radius:50%;background:transparent;color:#9AA8A2;font-size:15px}
.act-btn.rm:hover{background:var(--soft);color:#D64545}
.act-btn.rm.armed{width:auto;height:34px;padding:0 12px;border-radius:17px;background:#FCE9E9;color:#D64545}
.skel{display:flex;align-items:center;gap:13px;padding:11px 16px}
.skel i{display:block;border-radius:8px;background:linear-gradient(90deg,var(--soft) 25%,#E4ECE8 37%,var(--soft) 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite}
.skel .c{width:52px;height:52px;border-radius:50%;flex:none}
.skel .l{height:13px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.empty small{display:block;margin-top:6px;font-size:13px}

/* profile photo */
.av-edit{position:relative;flex:none;cursor:pointer}
.av-edit .cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--green-d);border:2px solid #fff;display:grid;place-items:center;font-size:11px}

/* toast */
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--text);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* auth */
[hidden]{display:none!important}
.auth{z-index:50;justify-content:center;align-items:center;padding:24px;background:#fff}
.auth-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.logo.big{width:68px;height:68px;border-radius:22px;font-size:36px;background:var(--green);color:var(--gold);margin:0 auto 4px;box-shadow:var(--shadow)}
.auth-card h2{font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--green)}
.auth-card p{color:var(--muted);font-size:14px;margin-bottom:6px}
.auth-card label{display:block}
.auth-card input{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:14px 16px;transition:border-color .2s}
.auth-card input:focus{border-color:var(--gold)}
.auth-err{color:#D64545!important;min-height:18px;margin:0!important;font-size:13px!important}
.auth-btn{background:var(--green);color:#fff;font-weight:700;border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.auth-btn:active{transform:scale(.97)}
.auth-btn:disabled{opacity:.6}
.auth-switch{color:var(--green);font-weight:600;font-size:14px;padding:8px}

.auth-btn{display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn .spin{display:none;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:var(--gold);animation:rot .7s linear infinite}
.auth-btn.loading .spin{display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.auth-card input:disabled,.auth-switch:disabled{opacity:.6}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="logo"><i class="fa-solid fa-sun"></i></span>
        <h1>SUNLIGHT</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="cameraBtn" aria-label="Camera"><i class="fa-solid fa-camera"></i></button>
        <button class="icon-btn" id="searchBtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>
    <div class="searchbar" id="searchbar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" type="search" placeholder="Search chats and messages" autocomplete="off">
      <button class="icon-btn small" id="searchClose" aria-label="Close search"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="dropdown" id="menu">
      <li data-act="group"><i class="fa-solid fa-user-group"></i>New group</li>
      <li data-act="star"><i class="fa-regular fa-star"></i>Starred messages</li>
      <li data-act="devices"><i class="fa-solid fa-laptop"></i>Linked devices</li>
      <li data-act="settings"><i class="fa-solid fa-gear"></i>Settings</li>
    </ul>
  </header>

  <main id="main">
    <!-- CHATS -->
    <section class="view active" id="view-chats">
      <nav class="tabs" id="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="unread">Unread<span class="pill" id="unreadCount"></span></button>
        <button class="tab" data-filter="fav">Favorites</button>
        <button class="tab" data-filter="group">Groups</button>
      </nav>
      <div class="stories" id="stories"></div>
      <div class="chat-list" id="chatList"></div>
    </section>

    <!-- UPDATES -->
    <section class="view" id="view-updates">
      <h2 class="title">Updates</h2>
      <div class="my-status" id="myStatus"></div>
      <h3 class="sub">Recent updates</h3>
      <div class="chat-list" id="updateList"></div>
    </section>

    <!-- COMMUNITIES -->
    <section class="view" id="view-communities">
      <h2 class="title">Communities</h2>
      <div class="chat-list" id="communityList"></div>
    </section>

    <!-- CALLS -->
    <section class="view" id="view-calls">
      <h2 class="title">Calls</h2>
      <div class="chat-list" id="callList"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <h2 class="title">Settings</h2>
      <div class="profile-card" id="profileCard"></div>
      <div class="settings-list" id="settingsList"></div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="New chat"><i class="fa-solid fa-message"></i></button>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-view="chats"><span class="nav-ico"><i class="fa-solid fa-message"></i></span>Chats</button>
    <button class="nav-item" data-view="updates"><span class="nav-ico"><i class="fa-regular fa-circle-dot"></i></span>Updates</button>
    <button class="nav-item" data-view="communities"><span class="nav-ico"><i class="fa-solid fa-users"></i></span>Communities</button>
    <button class="nav-item" data-view="calls"><span class="nav-ico"><i class="fa-solid fa-phone"></i></span>Calls</button>
    <button class="nav-item" data-view="settings"><span class="nav-ico"><i class="fa-solid fa-gear"></i></span>Settings</button>
  </nav>

  <!-- NEW CHAT -->
  <div class="screen" id="newChat">
    <div class="screen-head">
      <button class="icon-btn light" data-close="newChat" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div><strong>New chat</strong><small id="contactCount"></small></div>
    </div>
    <div class="ns-wrap">
      <div class="ns-bar" id="nsBar" role="search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="nsInput" type="search" placeholder="Search by name or username" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="40" aria-label="Search users">
        <span class="ns-spin" aria-hidden="true"></span>
        <button type="button" class="icon-btn small ns-clear" id="nsClear" aria-label="Clear search" hidden><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div class="ns-body" id="nsBody">
      <div id="nsHome">
        <div class="quick">
          <button data-act="group"><span class="q-ico"><i class="fa-solid fa-user-group"></i></span>New group</button>
          <button data-act="contact"><span class="q-ico"><i class="fa-solid fa-user-plus"></i></span>New contact</button>
          <button data-act="community"><span class="q-ico"><i class="fa-solid fa-users"></i></span>New community</button>
        </div>
        <h3 class="sub">My contacts</h3>
        <div class="chat-list" id="contactList"></div>
      </div>
      <div id="nsResults" hidden>
        <h3 class="sub" id="resTitle">Search results</h3>
        <div class="chat-list" id="resultList"></div>
      </div>
    </div>
  </div>

  <!-- CONVERSATION -->
  <div class="screen chat-screen" id="chatScreen">
    <div class="screen-head">
      <button class="icon-btn light" data-close="chatScreen" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="avatar sm" id="chatAvatar"></div>
      <div class="grow"><strong id="chatName"></strong><small id="chatState"></small></div>
      <button class="icon-btn light" id="favBtn" aria-label="Favorite"><i class="fa-regular fa-star"></i></button>
      <button class="icon-btn light" data-toast="Video calls are coming in the next update" aria-label="Video call"><i class="fa-solid fa-video"></i></button>
      <button class="icon-btn light" data-toast="Voice calls are coming in the next update" aria-label="Voice call"><i class="fa-solid fa-phone"></i></button>
    </div>
    <div class="messages" id="messages"></div>
    <button type="button" class="to-bottom" id="toBottom" hidden aria-label="Scroll to latest"><i class="fa-solid fa-chevron-down"></i></button>
    <div class="reply-bar" id="replyBar" hidden>
      <div class="rb-body"><strong id="rbName"></strong><span id="rbText"></span></div>
      <button type="button" class="icon-btn small" id="rbClose" aria-label="Cancel reply"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="composer" id="composer">
      <button type="button" class="icon-btn" id="attachBtn" aria-label="Attach photo"><i class="fa-solid fa-paperclip"></i></button>
      <textarea id="msgInput" rows="1" placeholder="Message" maxlength="2000" autocomplete="off" enterkeyhint="send"></textarea>
      <button type="button" class="send mic" id="micBtn" aria-label="Record voice note"><i class="fa-solid fa-microphone"></i></button>
      <button type="button" class="send" id="sendBtn" aria-label="Send" hidden><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <div class="rec-bar" id="recBar" hidden>
      <button type="button" class="icon-btn" id="recCancel" aria-label="Cancel recording"><i class="fa-solid fa-trash"></i></button>
      <span class="rec-dot"></span><strong id="recTime">0:00</strong><span class="rec-hint">Recording…</span>
      <button type="button" class="send" id="recSend" aria-label="Send voice note"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <div class="sheet-bg" id="sheetBg" hidden></div>
    <div class="sheet" id="attachSheet" hidden>
      <div class="grab"></div>
      <button type="button" id="shPhoto"><span class="s-ico"><i class="fa-solid fa-image"></i></span>Photo library</button>
      <button type="button" id="shCamera"><span class="s-ico"><i class="fa-solid fa-camera"></i></span>Take a photo</button>
    </div>
    <div class="sheet" id="msgSheet" hidden>
      <div class="grab"></div>
      <button type="button" id="shReply"><span class="s-ico"><i class="fa-solid fa-reply"></i></span>Reply</button>
      <button type="button" id="shCopy"><span class="s-ico"><i class="fa-regular fa-copy"></i></span>Copy text</button>
      <button type="button" id="shDel" class="danger"><span class="s-ico"><i class="fa-solid fa-trash"></i></span><span id="shDelTxt">Delete for everyone</span></button>
    </div>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lb-top"><button type="button" class="icon-btn" id="lbClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button><a id="lbSave" download="sunlight-photo.jpg" aria-label="Save photo"><i class="fa-solid fa-download"></i></a></div>
      <img id="lbImg" alt="Photo">
    </div>
    <div class="imgprev" id="imgPrev" hidden>
      <div class="lb-top"><button type="button" class="icon-btn" id="ipCancel" aria-label="Cancel"><i class="fa-solid fa-xmark"></i></button></div>
      <img id="ipImg" alt="Selected photo">
      <div class="ip-bar"><input id="ipCap" type="text" placeholder="Add a caption…" maxlength="500" autocomplete="off"><button type="button" class="send" id="ipSend" aria-label="Send photo"><i class="fa-solid fa-paper-plane"></i></button></div>
    </div>
    <input type="file" id="photoInput" accept="image/*" hidden>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
  </div>

  <!-- AUTH -->
  <div class="screen auth open" id="auth">
    <form class="auth-card" id="authForm">
      <span class="logo big"><i class="fa-solid fa-sun"></i></span>
      <h2>SUNLIGHT</h2>
      <p id="authSub">Log in to continue</p>
      <label hidden id="nameWrap"><input id="authName" type="text" placeholder="Your name" maxlength="40" autocomplete="name"></label>
      <label hidden id="emailWrap"><input id="authEmail" type="email" placeholder="Email (optional)" maxlength="100" autocomplete="email"></label>
      <label><input id="authUser" type="text" placeholder="Username or email" maxlength="100" autocomplete="username" autocapitalize="none" required></label>
      <label><input id="authPass" type="password" placeholder="Password" autocomplete="current-password" required></label>
      <p class="auth-err" id="authErr"></p>
      <button class="auth-btn" id="authBtn"><span class="spin" aria-hidden="true"></span><span id="authBtnTxt">Log in</span></button>
      <button type="button" class="auth-switch" id="authSwitch">New here? Create an account</button>
    </form>
  </div>

  <input type="file" id="avatarInput" accept="image/*" hidden>
  <div class="toast" id="toast"></div>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#075B42', '#0E7C5A', '#8A6D0B', '#2F6F8F', '#6B4E9B', '#B5533C'];

let token = localStorage.getItem('sl_token'), me = null, chats = [], contacts = [], results = [], current = null;
let filter = 'all', query = '', pollTimer = null, sigChats = '', sigContacts = '', sigMsgs = '';
let searchSeq = 0, searchTimer = null, lastQ = '', retryQ = '';
const favs = new Set(JSON.parse(localStorage.getItem('sl_favs') || '[]'));

/* ---------- API ---------- */
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch((window.SUNLIGHT_API || '') + '/api/' + path, {
      method: opts.body ? 'POST' : (opts.method || 'GET'),
      headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch { throw new Error('Cannot reach the server. Check your internet connection.'); }
  const data = await res.json().catch(() => null);
  if (!data) throw new Error(`Unexpected server response (HTTP ${res.status}). Make sure the Worker is deployed.`);
  if (res.status === 401 && token && path !== 'login' && path !== 'register') logout(true);
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

/* ---------- Helpers ---------- */
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const avImg = p => p.avatar ? `<img alt="" ${mediaDone.has(p.avatar) ? `src="${mediaDone.get(p.avatar)}"` : `data-av="${esc(p.avatar)}"`} onerror="this.remove()">` : '';
const avatar = (p, extra = '', dot = false) =>
  `<div class="avatar ${extra}" style="background:${COLORS[p.id % COLORS.length]}"><span>${esc(initials(p.name))}</span>${avImg(p)}${dot && p.online ? '<i class="dot"></i>' : ''}</div>`;
function hydrateAvatars() {                                 // photos are private downloads: fetched with the login token, shown over the initials
  $$('img[data-av]').forEach(img => {
    const key = img.dataset.av; img.removeAttribute('data-av');
    mediaUrl(key).then(u => { img.src = u; }).catch(() => img.remove());
  });
}
new MutationObserver(hydrateAvatars).observe($('#app'), { childList: true, subtree: true });
const tickIcon = t => !t ? '' : t === 'sending' ? '<i class="fa-regular fa-clock tick"></i>'
  : t === 'failed' ? '<i class="fa-solid fa-circle-exclamation tick fail"></i>'
  : t === 'sent' ? '<i class="fa-solid fa-check tick"></i>'
  : `<i class="fa-solid fa-check-double tick ${t === 'read' ? 'read' : ''}"></i>`;
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
function fmt(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return clock(ts);
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}
let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
const openScreen = id => $('#' + id).classList.add('open');
const closeScreen = id => $('#' + id).classList.remove('open');
const empty = (icon, text) => `<div class="empty"><i class="${icon}"></i>${text}</div>`;

/* ---------- Auth ---------- */
let mode = 'login';
function setMode(m) {
  mode = m;
  $('#nameWrap').hidden = m === 'login';
  $('#emailWrap').hidden = m === 'login';
  $('#authUser').placeholder = m === 'login' ? 'Username or email' : 'Username';
  $('#authSub').textContent = m === 'login' ? 'Log in to continue' : 'Create your SUNLIGHT account';
  $('#authBtnTxt').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('#authSwitch').textContent = m === 'login' ? 'New here? Create an account' : 'Already have an account? Log in';
  $('#authPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#authErr').textContent = '';
}
$('#authSwitch').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));
let busy = false;
function setBusy(on) {
  busy = on;
  const b = $('#authBtn');
  b.disabled = on; b.classList.toggle('loading', on); b.setAttribute('aria-busy', on);
  $$('#authForm input').forEach(i => i.disabled = on);
  $('#authSwitch').disabled = on;
  $('#authBtnTxt').textContent = on ? (mode === 'login' ? 'Logging in…' : 'Creating account…') : (mode === 'login' ? 'Log in' : 'Create account');
}
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;                                   // ignore repeated clicks while a request is running
  const username = $('#authUser').value.trim(), password = $('#authPass').value;
  const name = $('#authName').value.trim(), email = $('#authEmail').value.trim();
  const err = $('#authErr'); err.textContent = '';
  if (!username || !password) { err.textContent = 'Enter your username (or email) and password'; return; }
  if (mode === 'register' && !name) { err.textContent = 'Enter your name'; return; }
  setBusy(true);
  try {
    const d = await api(mode, { body: mode === 'login' ? { username, password } : { name, username, email, password } });
    token = d.token; localStorage.setItem('sl_token', token);
    $('#authPass').value = '';
    await start(d.user);                              // closes the login screen and shows the Chats home
  } catch (e2) { err.textContent = e2.message; }
  setBusy(false);
});

function logout(silent) {
  if (token && !silent) api('logout', { method: 'POST', body: {} }).catch(() => {});
  token = null; me = null; current = null; chats = []; contacts = []; results = [];
  localStorage.removeItem('sl_token');
  clearInterval(pollTimer); sigChats = sigContacts = sigMsgs = ''; resetSearch();
  ['chatScreen', 'newChat'].forEach(closeScreen);
  leaveChat(); mediaDone.forEach(u => URL.revokeObjectURL(u)); media.clear(); mediaDone.clear(); thread = []; pending = [];
  openScreen('auth'); setMode('login');
}

async function start(user) {
  me = user;
  closeScreen('auth');
  renderProfile();
  await Promise.all([loadChats(), loadContacts()]).catch(() => {});
  showView('chats');
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 4000);
}

/* ---------- Data loading ---------- */
async function loadChats() {
  const d = await api('chats');
  const next = d.chats.map(c => ({
    id: c.id, name: c.name, avatar: c.avatar || null, online: c.online, unread: c.unread, time: fmt(c.last_at), msg: c.last_body || '',
    type: c.last_type || 'text', deleted: !!c.last_deleted,
    tick: c.last_sender === me.id && !c.last_deleted ? (c.last_read ? 'read' : c.last_delivered ? 'delivered' : 'sent') : null
  }));
  const sig = JSON.stringify(next);
  chats = next;
  if (sig !== sigChats) { sigChats = sig; renderChats(); }
}
async function loadContacts() {
  const d = await api('contacts');
  const sig = JSON.stringify(d.contacts);
  contacts = d.contacts;
  if (sig !== sigContacts) { sigContacts = sig; renderStories(); renderLists(); syncResultFlags(); }
}
function poll() {
  if (!me || document.hidden) return;                       // no polling while the tab is hidden (saves D1 requests)
  loadChats().catch(() => {}); loadContacts().catch(() => {});
  if ($('#chatScreen').classList.contains('open') && !pending.some(p => p.status === 'sending')) loadMessages().catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

/* ---------- Rendering ---------- */
const previewHTML = c => c.deleted ? '<i class="fa-solid fa-ban"></i>Deleted message'
  : c.type === 'image' ? `<i class="fa-solid fa-camera"></i>${esc(c.msg) || 'Photo'}`
  : c.type === 'voice' ? '<i class="fa-solid fa-microphone"></i>Voice message' : esc(c.msg);
function renderChats() {
  const q = query.trim().toLowerCase();
  const list = chats.filter(c =>
    (filter === 'all' || (filter === 'unread' && c.unread) || (filter === 'fav' && favs.has(c.id))) &&
    (!q || c.name.toLowerCase().includes(q) || c.msg.toLowerCase().includes(q)));
  $('#chatList').innerHTML = list.length ? list.map((c, i) => `
    <div class="row" data-id="${c.id}" style="animation-delay:${Math.min(i, 8) * 30}ms">
      ${avatar(c, '', true)}
      <div class="body">
        <div class="line"><strong>${esc(c.name)}</strong><span class="time ${c.unread ? 'new' : ''}">${esc(c.time)}</span></div>
        <div class="preview"><span class="grow">${tickIcon(c.tick)}<span class="txt">${previewHTML(c)}</span></span>
          ${favs.has(c.id) && !c.unread ? '<i class="fa-solid fa-star fav-ico"></i>' : ''}
          ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>
      </div>
    </div>`).join('')
    : q ? empty('fa-regular fa-comment-dots', `No chats match “${esc(query)}”`)
    : filter === 'group' ? empty('fa-solid fa-user-group', 'Groups are coming soon')
    : filter === 'fav' ? empty('fa-regular fa-star', 'Open a chat and tap the star to add a favorite')
    : filter === 'unread' ? empty('fa-solid fa-check-double', 'You’re all caught up')
    : empty('fa-regular fa-comment-dots', 'No chats yet.<br>Tap the green button to start one.');
  const total = chats.filter(c => c.unread).length;
  const pill = $('#unreadCount');
  pill.textContent = total; pill.classList.toggle('show', total > 0);
}

function renderProfile() {
  const mine = avatar(me, '');
  $('#profileCard').innerHTML = `<div class="av-edit" data-set="__photo" role="button" aria-label="Change profile photo">${mine.replace('class="avatar ', 'class="avatar big ')}<i class="cam fa-solid fa-camera"></i></div><div><strong>${esc(me.name)}</strong><p>@${esc(me.username)}</p></div>`;
  $('#myStatus').innerHTML = `${mine.replace('</div>', '<i class="add-badge fa-solid fa-plus"></i></div>')}<div><strong>My status</strong><p>Tap to add a status update</p></div>`;
  $('#settingsList').innerHTML = [
    ['fa-camera', 'Profile photo', me.avatar ? 'Change your photo' : 'Add a photo so friends recognise you', '__photo'],
    ...(me.avatar ? [['fa-trash', 'Remove photo', 'Go back to your initials', '__rmphoto']] : []),
    ['fa-key', 'Account', '@' + me.username, 'Account'],
    ['fa-bell', 'Notifications', 'Message tones', 'Notifications'],
    ['fa-circle-question', 'Help', 'Help centre, contact us', 'Help'],
    ['fa-right-from-bracket', 'Log out', 'Sign out of this device', '__logout']
  ].map(s => `<div class="set-row" data-set="${s[3]}"><span class="set-ico"><i class="fa-solid ${s[0]}"></i></span><div><strong>${s[1]}</strong><small>${esc(s[2])}</small></div></div>`).join('');
}

function renderStories() {
  const mine = `<div class="story" data-toast="Add status"><div class="avatar" style="background:${COLORS[me.id % COLORS.length]}"><span>${esc(initials(me.name))}</span><i class="add-badge fa-solid fa-plus"></i></div><span class="n">My status</span></div>`;
  $('#stories').innerHTML = mine + contacts.slice(0, 10).map(u =>
    `<div class="story" data-contact="${u.id}">${avatar(u, `ring ${u.online ? '' : 'seen'}`)}<span class="n">${esc(u.name.split(' ')[0])}</span></div>`).join('');

/* ---------- Conversation ---------- */
const MAX_REC = 300, MAX_VOICE_BYTES = 900000;              // longest voice note (seconds) / biggest file (D1 storage)
let thread = [], pending = [], replyTo = null, uid = 0, rec = null, sheetMsg = null, sheetAt = 0, previewBlob = null, previewUrl = '';
const media = new Map();                                    // media key -> Promise<blob URL>  (authenticated download, cached)
const mediaDone = new Map();                                // media key -> blob URL once loaded
const player = new Audio(); let playing = null;             // key of the voice note currently loaded in the player
const $msgs = $('#messages'), $input = $('#msgInput');
const coarse = matchMedia('(pointer:coarse)').matches;

const scrollDown = () => { $msgs.scrollTop = $msgs.scrollHeight; updateToBottom(); };
const updateToBottom = () => { $('#toBottom').hidden = $msgs.scrollHeight - $msgs.scrollTop - $msgs.clientHeight < 300; };
const updateFav = () => { $('#favBtn i').className = (current && favs.has(current.id) ? 'fa-solid' : 'fa-regular') + ' fa-star'; };
const fmtDur = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const dayLabel = ts => {
  const d = new Date(ts), n = new Date();
  return d.toDateString() === n.toDateString() ? 'Today' : d.toDateString() === new Date(n - 864e5).toDateString() ? 'Yesterday'
    : d.toLocaleDateString([], { day: 'numeric', month: 'short', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' });
};
const seenText = ts => {
  const d = new Date(ts), n = new Date();
  return d.toDateString() === n.toDateString() ? 'last seen today at ' + clock(ts)
    : d.toDateString() === new Date(n - 864e5).toDateString() ? 'last seen yesterday at ' + clock(ts)
    : 'last seen ' + d.toLocaleDateString([], { day: 'numeric', month: 'short' });
};
const previewText = m => m.deleted_at ? 'Deleted message' : m.type === 'image' ? (m.body ? 'Photo: ' + m.body : 'Photo') : m.type === 'voice' ? 'Voice message (' + fmtDur(m.duration || 0) + ')' : m.body;
const tickState = m => m.status || (m.read_at ? 'read' : m.delivered_at ? 'delivered' : 'sent');

function mediaUrl(key) {                                    // media is private: fetched with the login token, cached as a blob URL
  if (!media.has(key)) media.set(key, api('media/' + key)
    .then(d => fetch('data:' + d.type + ';base64,' + d.data)).then(r => r.blob())
    .then(b => { const u = URL.createObjectURL(b); mediaDone.set(key, u); return u; })
    .catch(e => { media.delete(key); throw e; }));
  return media.get(key);
}
const toBase64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = no; r.readAsDataURL(blob); });

}

/* --- rendering --- */
function quoteHTML(id) {
  const q = thread.find(x => x.id === id);
  return `<div class="quote" data-jump="${id}"><strong>${q ? (q.sender_id === me.id ? 'You' : esc(current.name)) : 'Message'}</strong><span>${q ? esc(previewText(q)) : 'Original message'}</span></div>`;
}
function bodyHTML(m) {
  if (m.deleted_at) return `<span class="del"><i class="fa-solid fa-ban"></i> ${m.sender_id === me.id ? 'You deleted this message' : 'This message was deleted'}</span>`;
  let h = m.reply_to ? quoteHTML(m.reply_to) : '';
  if (m.type === 'image') {
    const u = mediaDone.get(m.media_key);
    h += `<div class="img-wrap${u ? ' loaded' : ''}" data-img="${esc(m.media_key)}"><img alt="Photo" ${u ? `src="${u}"` : `data-key="${esc(m.media_key)}"`}></div>` + (m.body ? `<div class="cap">${esc(m.body)}</div>` : '');
  } else if (m.type === 'voice') {
    h += `<div class="voice" data-key="${esc(m.media_key)}" data-dur="${m.duration || 0}"><button type="button" class="v-play" aria-label="Play voice note"><i class="fa-solid fa-play"></i></button><div class="v-track"><div class="v-bar"><div class="v-fill"></div></div></div><span class="v-time">${fmtDur(m.duration || 0)}</span></div>`;
  } else h += esc(m.body).replace(/\n/g, '<br>');
  return h;
}
function renderMessages(force) {
  if (!current) return;
  const near = $msgs.scrollHeight - $msgs.scrollTop - $msgs.clientHeight < 140;
  const all = [...thread, ...pending.filter(p => p.to === current.id)];
  let html = '', lastDay = '', prev = null;
  for (const m of all) {
    const day = new Date(m.created_at).toDateString();
    if (day !== lastDay) { lastDay = day; prev = null; html += `<div class="day">${dayLabel(m.created_at)}</div>`; }
    const out = m.sender_id === me.id;
    const cls = ['msg', out ? 'out' : 'in', prev && prev.sender_id === m.sender_id && m.created_at - prev.created_at < 3e5 ? 'grp' : '',
      m.status === 'failed' ? 'failed' : '', m.type === 'image' && !m.body && !m.deleted_at ? 'media-only' : ''].filter(Boolean).join(' ');
    html += `<div class="${cls}" data-mid="${m.id || ''}" data-tmp="${m.tmp || ''}">${bodyHTML(m)}<small>${clock(m.created_at)}${out && !m.deleted_at ? tickIcon(tickState(m)) : ''}</small>${m.status === 'failed' ? '<div class="retry"><i class="fa-solid fa-rotate-right"></i> Tap to retry</div>' : ''}</div>`;
    prev = m;
  }
  $msgs.innerHTML = html || '<div class="day">Say hello 👋</div>';
  hydrate(); syncVoiceUI();
  if (force || near) scrollDown(); else updateToBottom();
}
function hydrate() {
  $$('img[data-key]', $msgs).forEach(img => {
    const wrap = img.closest('.img-wrap');
    mediaUrl(img.dataset.key).then(u => { img.src = u; wrap.classList.add('loaded'); }).catch(() => wrap.classList.add('err'));
  });
}
function syncVoiceUI() {
  $$('.voice', $msgs).forEach(v => {
    const on = v.dataset.key === playing, dur = +v.dataset.dur || 0;
    v.classList.toggle('on', on);
    v.querySelector('.v-play i').className = 'fa-solid ' + (on && !player.paused ? 'fa-pause' : 'fa-play');
    v.querySelector('.v-fill').style.width = on && dur ? Math.min(100, player.currentTime / dur * 100) + '%' : '0%';
    v.querySelector('.v-time').textContent = fmtDur(on && player.currentTime ? player.currentTime : dur);
  });
}
['timeupdate', 'play', 'pause'].forEach(ev => player.addEventListener(ev, syncVoiceUI));
player.addEventListener('ended', () => { playing = null; syncVoiceUI(); });
async function toggleVoice(v) {
  const key = v.dataset.key;
  if (playing === key) { player.paused ? player.play().catch(() => {}) : player.pause(); return; }
  try { const url = await mediaUrl(key); player.pause(); player.src = url; playing = key; await player.play(); }
  catch { playing = null; toast('Could not play this voice note'); }
  syncVoiceUI();
}
function seekVoice(track, e) {

  const r = track.getBoundingClientRect(), dur = +v.dataset.dur || player.duration;
  if (dur && isFinite(dur)) { try { player.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * dur; } catch {} }
}

/* --- open / load --- */
function openChat(id) {

/* --- sending (optimistic: message shows at once with a clock, then ticks; failures can be retried) --- */
function queue(p) {
  const m = Object.assign({ tmp: 'p' + (++uid), sender_id: me.id, created_at: Date.now(), status: 'sending', to: current.id, reply_to: replyTo ? replyTo.id : null }, p);
  pending.push(m); clearReply(); renderMessages(true); deliver(m);
}
async function deliver(m) {
  m.status = 'sending'; renderMessages();
  try {
    const payload = { to: m.to, type: m.type, body: m.body || '', reply_to: m.reply_to };
    if (m.blob) {
      if (!m.uploaded) m.uploaded = await upload(m.blob, m.type === 'image' ? 'image' : 'voice');
      payload.media_key = m.uploaded.key; payload.duration = m.duration;
      media.set(m.uploaded.key, media.get(m.media_key)); mediaDone.set(m.uploaded.key, mediaDone.get(m.media_key));
    }
    await api('messages', { body: payload });
    pending = pending.filter(x => x !== m);
    if (current && current.id === m.to) await loadMessages(true);
    loadChats().catch(() => {});
  } catch (err) { m.status = 'failed'; renderMessages(); toast(err.message); }
}
function localMedia(blob) {
  const key = 'local:' + (++uid), url = URL.createObjectURL(blob);
  media.set(key, Promise.resolve(url)); mediaDone.set(key, url); return key;
}

  $input.value = ''; autosize(); syncComposer();
  queue({ type: 'text', body: text });
}

/* --- message list interactions: long-press menu, play, open photo, jump to reply, retry --- */
let lpTimer = null, lpX = 0, lpY = 0;

/* --- photos: pick, compress, preview with caption, send --- */
async function loadBitmap(file) {
  try { return await createImageBitmap(file); }
  catch { return new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = URL.createObjectURL(file); }); }
}
async function squareAvatar(file, size = 256) {             // centred square crop, 256px: a profile photo is only ~15-30KB
  const src = await loadBitmap(file), side = Math.min(src.width, src.height);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, size, size);
  g.drawImage(src, (src.width - side) / 2, (src.height - side) / 2, side, side, 0, 0, size, size);
  for (const q of [.85, .7, .55]) { const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q)); if (b && b.size <= 200000) return b; }
  throw new Error('Photo is too large');
}
async function changeAvatar(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('Please choose a photo');
  toast('Uploading photo…');
  try {
    const blob = await squareAvatar(file), up = await upload(blob, 'image');
    const d = await api('profile/avatar', { body: { key: up.key } });
    const url = URL.createObjectURL(blob); media.set(d.avatar, Promise.resolve(url)); mediaDone.set(d.avatar, url);   // show it at once from the local copy
    me.avatar = d.avatar; renderProfile(); renderStories(); toast('Profile photo updated');
  } catch (err) { toast(err.message); }
}
async function removeAvatar() {
  try { await api('profile/avatar/remove', { body: {} }); me.avatar = null; renderProfile(); renderStories(); toast('Profile photo removed'); }
  catch (err) { toast(err.message); }
}
$('#avatarInput').addEventListener('change', e => { changeAvatar(e.target.files[0]); e.target.value = ''; });
async function compressImage(file) {                        // shrink until <= 900KB (photos are stored in D1)
  const src = await loadBitmap(file);
  for (const [max, q] of [[1600, .82], [1280, .72], [1024, .62], [800, .55], [640, .5]]) {
    const k = Math.min(1, max / Math.max(src.width, src.height));
    const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', q));
    if (blob && blob.size <= 900000) return blob;
  }
  throw new Error('too large');
}
async function pickPhoto(input) {

  catch { toast('Could not read this photo'); }
}

/* --- voice notes: tap mic to record, trash to cancel, send button to send --- */
const showRec = on => { $('#recBar').hidden = !on; $('#composer').hidden = on; $('#recTime').textContent = '0:00'; };

  if (rec || !current) return;

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch { return toast('Allow microphone access to record voice notes'); }
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 24000 }, mime ? { mimeType: mime } : {}));   // 24 kbps: clear speech, small files
  const r = rec = { mr, chunks: [], bytes: 0, capped: false, t0: Date.now(), send: false };
  mr.ondataavailable = e => {
    if (!e.data || !e.data.size) return;
    r.chunks.push(e.data); r.bytes += e.data.size;
    if (r.bytes > MAX_VOICE_BYTES && !r.capped) { r.capped = true; toast('Maximum voice note length reached'); stopRec(true); }
  };
  mr.onstop = () => {
    clearInterval(r.timer); stream.getTracks().forEach(t => t.stop()); if (rec === r) rec = null; showRec(false);
    if (!r.send || !current) return;
    const secs = Math.round((Date.now() - r.t0) / 1000);
    if (secs < 1 || !r.chunks.length) return toast('Voice note too short');
    const blob = new Blob(r.chunks, { type: mr.mimeType || mime || 'audio/webm' });
    if (blob.size > 990000) return toast('Voice note is too long, please record a shorter one');
    queue({ type: 'voice', body: '', blob, duration: secs, media_key: localMedia(blob) });
  };
  mr.start(1000); showRec(true);
  r.timer = setInterval(() => { const s = Math.floor((Date.now() - r.t0) / 1000); $('#recTime').textContent = fmtDur(s); if (s >= MAX_REC) stopRec(true); }, 250);
}
function stopRec(send) { if (!rec) return; rec.send = send; if (rec.mr.state !== 'inactive') rec.mr.stop(); }
$('#micBtn').addEventListener('click', startRec);
$('#recCancel').addEventListener('click', () => stopRec(false));
$('#recSend').addEventListener('click', () => stopRec(true));

$('#chatList').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) openChat(r.dataset.id); });
document.addEventListener('click', e => { const r = e.target.closest('[data-contact]'); if (r) openChat(r.dataset.contact); });
$('#favBtn').addEventListener('click', () => {
  if (!current) return;
  favs.has(current.id) ? favs.delete(current.id) : favs.add(current.id);
  localStorage.setItem('sl_favs', JSON.stringify([...favs]));
  updateFav(); renderChats();
  toast(favs.has(current.id) ? 'Added to favorites' : 'Removed from favorites');
});

/* ---------- Search users & contacts ---------- */
const nsInput = $('#nsInput'), nsBar = $('#nsBar'), nsClear = $('#nsClear');
const showResults = on => { $('#nsHome').hidden = on; $('#nsResults').hidden = !on; $('#nsBody').scrollTop = 0; };
const hl = (text, q) => {                                   // highlight the matching part (safe: everything escaped)
  const i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
};
const skeleton = () => Array.from({ length: 5 }, (_, i) =>
  `<div class="skel"><i class="c"></i><div style="flex:1"><i class="l" style="width:${50 - i * 4}%"></i><i class="l" style="width:${32 + i * 3}%;margin-top:9px"></i></div></div>`).join('');

function resultRow(u, q) {
  const btn = u.is_contact
    ? '<button class="act-btn added" disabled><i class="fa-solid fa-check"></i>Added</button>'
    : `<button class="act-btn add" data-add="${u.id}"><i class="fa-solid fa-user-plus"></i>Add</button>`;
  return `<div class="row" data-open="${u.id}">${avatar(u, '', true)}
    <div class="body"><div class="line"><strong>${hl(u.name, q)}</strong></div>
    <div class="preview"><span class="txt">@${hl(u.username, q)}</span>${u.online ? '<span class="on">· Online</span>' : ''}</div></div>${btn}</div>`;
}
function renderResults() {
  $('#resTitle').textContent = results.length ? `${results.length} ${results.length === 1 ? 'person' : 'people'} found` : 'Search results';
  $('#resultList').innerHTML = results.length ? results.map(u => resultRow(u, lastQ)).join('')
    : empty('fa-regular fa-face-frown', `No one found for “${esc(lastQ)}”<small>Check the spelling, or try their username.</small>`);
}
function syncResultFlags() {                                // keep Add/Added buttons in step with the contact list
  if (!results.length) return;
  const ids = new Set(contacts.map(c => c.id));
  results.forEach(u => { u.is_contact = ids.has(u.id); });
  if (!$('#nsResults').hidden) renderResults();
}
async function runSearch(q) {
  const seq = ++searchSeq;
  nsBar.classList.add('loading');
  try {
    const d = await api('users/search?q=' + encodeURIComponent(q));
    if (seq !== searchSeq) return;                          // a newer search replaced this one
    results = d.users; lastQ = q; renderResults();
  } catch (err) {
    if (seq !== searchSeq) return;
    results = []; retryQ = q;
    $('#resultList').innerHTML = empty('fa-solid fa-triangle-exclamation', `${esc(err.message)}<small><button type="button" class="act-btn add" data-retry="search" style="margin-top:12px"><i class="fa-solid fa-rotate-right"></i>Try again</button></small>`);
  }
  nsBar.classList.remove('loading');
}
function resetSearch() {
  clearTimeout(searchTimer); searchSeq++;
  nsInput.value = ''; nsClear.hidden = true; nsBar.classList.remove('loading');
  results = []; lastQ = ''; showResults(false);
}
nsInput.addEventListener('input', () => {
  const q = nsInput.value.trim().replace(/^@+/, '');
  nsClear.hidden = !nsInput.value;
  clearTimeout(searchTimer);
  if (!q) { searchSeq++; results = []; nsBar.classList.remove('loading'); showResults(false); return; }
  if (!results.length) $('#resultList').innerHTML = skeleton();
  showResults(true);
  searchTimer = setTimeout(() => runSearch(q), 220);
});
nsInput.addEventListener('keydown', e => { if (e.key === 'Enter') nsInput.blur(); });
nsClear.addEventListener('click', () => { resetSearch(); nsInput.focus(); });

async function addContact(id, btn) {
  btn.disabled = true;
  try {
    const d = await api('contacts', { body: { user_id: id } });
    const r = results.find(u => u.id === id); if (r) r.is_contact = true;
    if (!$('#nsResults').hidden) renderResults();
    toast(d.already ? 'Already in your contacts' : 'Added to contacts');
    await loadContacts();
  } catch (err) { toast(err.message); btn.disabled = false; }
}
async function removeContact(id, btn) {
  if (!btn.classList.contains('armed')) {                   // first tap arms, second tap confirms
    btn.classList.add('armed'); btn.innerHTML = '<i class="fa-solid fa-trash"></i>Remove';
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.innerHTML = '<i class="fa-solid fa-user-minus"></i>'; } }, 3000);
    return;
  }
  btn.disabled = true;
  try {
    await api('contacts/remove', { body: { user_id: id } });
    toast('Removed from contacts');
    await loadContacts();
  } catch (err) { toast(err.message); btn.disabled = false; }
}
function showContactsError(err) {                           // initial contact list could not load: say so, offer a retry
  if (contacts.length) return;
  $('#contactList').innerHTML = empty('fa-solid fa-triangle-exclamation', `Could not load your contacts<small>${esc(err.message)}<br><button type="button" class="act-btn add" data-retry="contacts" style="margin-top:12px"><i class="fa-solid fa-rotate-right"></i>Try again</button></small>`);
}
$('#newChat').addEventListener('click', e => {
  const rt = e.target.closest('[data-retry]');
  if (rt) {
    if (rt.dataset.retry === 'search' && retryQ) { $('#resultList').innerHTML = skeleton(); return runSearch(retryQ); }
    if (rt.dataset.retry === 'contacts') { $('#contactList').innerHTML = skeleton(); sigContacts = ''; return loadContacts().catch(showContactsError); }
  }
  const add = e.target.closest('[data-add]'); if (add) return addContact(+add.dataset.add, add);
  const rm = e.target.closest('[data-remove]'); if (rm) return removeContact(+rm.dataset.remove, rm);
  const row = e.target.closest('[data-open]'); if (row) openChat(row.dataset.open);
});

/* ---------- Init ---------- */
setMode('login');
if (token) api('me').then(d => start(d.user)).catch(() => logout(true));
</script>
