<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075B42">
<title>SUNLIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --green:#075B42; --green-d:#054733; --gold:#F5C542; --gold-s:rgba(245,197,66,.22);
  --bg:#fff; --text:#17231F; --muted:#6B7A74; --line:#EAF0ED; --soft:#F4F8F6; --blue:#2F9BFF;
  --shadow:0 6px 20px rgba(7,91,66,.16); --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:#E9EFEC;color:var(--text);font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
ul{list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{position:relative;display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.12)}

/* header */
.top{position:relative;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;height:42px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;color:var(--gold);font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.logo i{animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.06em}
.top-actions{display:flex;gap:2px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:inherit;transition:background .2s,transform .15s}
.icon-btn:active{background:rgba(255,255,255,.16);transform:scale(.92)}
.icon-btn.small{width:32px;height:32px;font-size:15px}
.icon-btn.light{color:#fff}
.searchbar{display:flex;align-items:center;gap:10px;background:#fff;color:var(--text);border-radius:14px;padding:0 6px 0 14px;height:0;opacity:0;overflow:hidden;margin-top:0;transition:height .25s,opacity .25s,margin .25s}
.searchbar.open{height:44px;opacity:1;margin-top:10px}
.searchbar i{color:var(--muted);font-size:14px}
.searchbar input{flex:1;min-width:0}
.searchbar .icon-btn{color:var(--muted)}
.dropdown{position:absolute;right:12px;top:calc(54px + env(safe-area-inset-top,0px));width:210px;background:#fff;color:var(--text);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.22);opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;pointer-events:none;transition:.18s}
.dropdown.open{opacity:1;transform:none;pointer-events:auto}
.dropdown li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;font-weight:500;cursor:pointer}
.dropdown li i{width:18px;color:var(--green);text-align:center}
.dropdown li:active,.dropdown li:hover{background:var(--soft)}

/* main + views */
main{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:96px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{display:none}
.view.active{display:block;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.title{font-size:24px;font-weight:800;padding:18px 16px 8px}
.sub{font-size:13px;font-weight:600;color:var(--muted);padding:14px 16px 6px}

/* tabs */
.tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;padding:8px 16px;border-radius:20px;background:var(--soft);color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:.25s}
.tab.active{background:var(--green);color:#fff}
.tab.active::after{content:"";position:absolute;left:50%;bottom:-3px;width:18px;height:3px;border-radius:3px;background:var(--gold);transform:translateX(-50%)}
.pill{background:var(--gold);color:var(--text);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;place-items:center;padding:0 5px}
.pill.show{display:grid}

/* stories */
.stories{display:flex;gap:14px;padding:14px 14px 10px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 64px;text-align:center;font-size:12px;font-weight:500}
.story .avatar{margin:0 auto 6px}
.story span.n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{border:2px solid var(--green);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold);margin:4px}
.ring.seen{border-color:#CBD6D1;box-shadow:0 0 0 2px #fff,0 0 0 4px #E3EAE7}
.add-badge{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--green-d);border:2px solid #fff;display:grid;place-items:center;font-size:10px}

/* avatar */
.avatar{position:relative;width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar.sm{width:40px;height:40px;font-size:15px}
.avatar.big{width:64px;height:64px;font-size:24px}
.avatar .dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:#2DCB73;border:2.5px solid #fff}

/* rows */
.row{display:flex;align-items:center;gap:13px;padding:11px 16px;cursor:pointer;transition:background .15s;animation:fade .3s ease both}
.row:active{background:var(--soft)}
.row .body{flex:1;min-width:0;border-bottom:1px solid var(--line);padding-bottom:11px;margin-bottom:-11px;padding-top:0}
.row:last-child .body{border-bottom:0}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px}
.line strong{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time{font-size:12px;color:var(--muted);flex:none}
.time.new{color:var(--green);font-weight:600}
.preview{color:var(--muted);font-size:14px;margin-top:3px;display:flex;align-items:center;gap:5px;min-width:0}
.preview .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview .grow{flex:1;min-width:0;display:flex;align-items:center;gap:5px}
.tick{font-size:12px;color:#9AA8A2;flex:none}
.tick.read{color:var(--blue)}
.badge{background:var(--green);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex:none}
.fav-ico{color:var(--gold);font-size:12px}
.missed strong,.missed .txt{color:#D64545}
.call-btn{color:var(--green);font-size:17px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.empty{text-align:center;color:var(--muted);padding:48px 24px}
.empty i{font-size:30px;color:var(--gold);margin-bottom:12px;display:block}

/* updates / settings */
.my-status{display:flex;align-items:center;gap:13px;padding:8px 16px}
.my-status p,.profile-card p{color:var(--muted);font-size:13px;margin-top:2px}
.profile-card{display:flex;align-items:center;gap:14px;margin:6px 16px 10px;padding:16px;border-radius:var(--r);background:var(--soft)}
.set-row{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.set-row:active{background:var(--soft)}
.set-ico{width:36px;height:36px;border-radius:11px;background:var(--gold-s);color:var(--green);display:grid;place-items:center;font-size:15px}
.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* fab */
.fab{position:absolute;right:18px;bottom:88px;width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;font-size:21px;display:grid;place-items:center;box-shadow:var(--shadow);border:3px solid var(--gold);z-index:15;transition:transform .2s,opacity .2s}
.fab:active{transform:scale(.9)}
.fab.hide{transform:scale(0);opacity:0;pointer-events:none}

/* bottom nav */
.bottom-nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(23,35,31,.06);z-index:16}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--muted);transition:color .2s}
.nav-ico{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:16px;transition:background .25s}
.nav-item.active{color:var(--green);font-weight:700}
.nav-item.active .nav-ico{background:var(--gold-s)}

/* overlay screens */
.screen{position:absolute;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .3s cubic-bezier(.3,.8,.3,1),visibility .3s}
.screen.open{transform:none;visibility:visible}
.screen-head{display:flex;align-items:center;gap:8px;background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 8px 10px 6px;min-height:62px}
.screen-head strong{display:block;font-size:17px;font-weight:600}
.screen-head small{display:block;font-size:12px;opacity:.8;margin-top:1px}
.screen-head .grow{flex:1;min-width:0}
.screen > .chat-list,.screen > .sub{flex:none}
#newChat{overflow-y:auto}
.quick button{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;font-weight:600;text-align:left}
.quick button:active{background:var(--soft)}
.q-ico{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--green-d);display:grid;place-items:center}

/* conversation */
.chat-screen{background:#F3F1EA}
.messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:#fff;color:var(--muted);font-size:12px;font-weight:500;padding:5px 12px;border-radius:10px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg{max-width:80%;padding:8px 12px 6px;border-radius:14px;font-size:15px;line-height:1.4;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.07);animation:pop .22s ease both}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
.msg.in{align-self:flex-start;background:#fff;border-top-left-radius:4px}
.msg.out{align-self:flex-end;background:#D5EBDD;border-top-right-radius:4px}
.msg small{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:2px}
.typing{align-self:flex-start;background:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA8A2;animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-4px)}}
.composer{display:flex;align-items:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line)}
.composer .icon-btn{color:var(--muted)}
.composer input{flex:1;min-width:0;background:var(--soft);border-radius:22px;padding:11px 16px}
.send{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:16px;flex:none;transition:transform .15s}
.send:active{transform:scale(.9)}

/* toast */
.toast{position:absolute;left:50%;bottom:100px;transform:translate(-50%,20px);background:var(--text);color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* auth */
[hidden]{display:none!important}
.auth{z-index:50;justify-content:center;align-items:center;padding:24px;background:#fff}
.auth-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;text-align:center}
.logo.big{width:68px;height:68px;border-radius:22px;font-size:36px;background:var(--green);color:var(--gold);margin:0 auto 4px;box-shadow:var(--shadow)}
.auth-card h2{font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--green)}
.auth-card p{color:var(--muted);font-size:14px;margin-bottom:6px}
.auth-card label{display:block}
.auth-card input{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:14px 16px;transition:border-color .2s}
.auth-card input:focus{border-color:var(--gold)}
.auth-err{color:#D64545!important;min-height:18px;margin:0!important;font-size:13px!important}
.auth-btn{background:var(--green);color:#fff;font-weight:700;border-radius:14px;padding:14px;box-shadow:var(--shadow);transition:transform .15s}
.auth-btn:active{transform:scale(.97)}
.auth-btn:disabled{opacity:.6}
.auth-switch{color:var(--green);font-weight:600;font-size:14px;padding:8px}

.auth-btn{display:flex;align-items:center;justify-content:center;gap:10px}
.auth-btn .spin{display:none;width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:var(--gold);animation:rot .7s linear infinite}
.auth-btn.loading .spin{display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.auth-card input:disabled,.auth-switch:disabled{opacity:.6}
</style>
</head>
<body>
<div class="app" id="app">

  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="logo"><i class="fa-solid fa-sun"></i></span>
        <h1>SUNLIGHT</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="cameraBtn" aria-label="Camera"><i class="fa-solid fa-camera"></i></button>
        <button class="icon-btn" id="searchBtn" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" id="menuBtn" aria-label="Menu"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      </div>
    </div>
    <div class="searchbar" id="searchbar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input id="searchInput" type="search" placeholder="Search chats and messages" autocomplete="off">
      <button class="icon-btn small" id="searchClose" aria-label="Close search"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <ul class="dropdown" id="menu">
      <li data-act="group"><i class="fa-solid fa-user-group"></i>New group</li>
      <li data-act="star"><i class="fa-regular fa-star"></i>Starred messages</li>
      <li data-act="devices"><i class="fa-solid fa-laptop"></i>Linked devices</li>
      <li data-act="settings"><i class="fa-solid fa-gear"></i>Settings</li>
    </ul>
  </header>

  <main id="main">
    <!-- CHATS -->
    <section class="view active" id="view-chats">
      <nav class="tabs" id="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="unread">Unread<span class="pill" id="unreadCount"></span></button>
        <button class="tab" data-filter="fav">Favorites</button>
        <button class="tab" data-filter="group">Groups</button>
      </nav>
      <div class="stories" id="stories"></div>
      <div class="chat-list" id="chatList"></div>
    </section>

    <!-- UPDATES -->
    <section class="view" id="view-updates">
      <h2 class="title">Updates</h2>
      <div class="my-status" id="myStatus"></div>
      <h3 class="sub">Recent updates</h3>
      <div class="chat-list" id="updateList"></div>
    </section>

    <!-- COMMUNITIES -->
    <section class="view" id="view-communities">
      <h2 class="title">Communities</h2>
      <div class="chat-list" id="communityList"></div>
    </section>

    <!-- CALLS -->
    <section class="view" id="view-calls">
      <h2 class="title">Calls</h2>
      <div class="chat-list" id="callList"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <h2 class="title">Settings</h2>
      <div class="profile-card" id="profileCard"></div>
      <div class="settings-list" id="settingsList"></div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="New chat"><i class="fa-solid fa-message"></i></button>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-view="chats"><span class="nav-ico"><i class="fa-solid fa-message"></i></span>Chats</button>
    <button class="nav-item" data-view="updates"><span class="nav-ico"><i class="fa-regular fa-circle-dot"></i></span>Updates</button>
    <button class="nav-item" data-view="communities"><span class="nav-ico"><i class="fa-solid fa-users"></i></span>Communities</button>
    <button class="nav-item" data-view="calls"><span class="nav-ico"><i class="fa-solid fa-phone"></i></span>Calls</button>
    <button class="nav-item" data-view="settings"><span class="nav-ico"><i class="fa-solid fa-gear"></i></span>Settings</button>
  </nav>

  <!-- NEW CHAT -->
  <div class="screen" id="newChat">
    <div class="screen-head">
      <button class="icon-btn light" data-close="newChat" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div><strong>New chat</strong><small id="contactCount"></small></div>
    </div>
    <div class="quick">
      <button data-act="group"><span class="q-ico"><i class="fa-solid fa-user-group"></i></span>New group</button>
      <button data-act="contact"><span class="q-ico"><i class="fa-solid fa-user-plus"></i></span>New contact</button>
      <button data-act="community"><span class="q-ico"><i class="fa-solid fa-users"></i></span>New community</button>
    </div>
    <h3 class="sub">Contacts on SUNLIGHT</h3>
    <div class="chat-list" id="contactList"></div>
  </div>

  <!-- CONVERSATION -->
  <div class="screen chat-screen" id="chatScreen">
    <div class="screen-head">
      <button class="icon-btn light" data-close="chatScreen" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
      <div class="avatar sm" id="chatAvatar"></div>
      <div class="grow"><strong id="chatName"></strong><small id="chatState"></small></div>
      <button class="icon-btn light" id="favBtn" aria-label="Favorite"><i class="fa-regular fa-star"></i></button>
      <button class="icon-btn light" data-toast="Voice call"><i class="fa-solid fa-phone"></i></button>
    </div>
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer">
      <button type="button" class="icon-btn" data-toast="Attachments"><i class="fa-solid fa-paperclip"></i></button>
      <input id="msgInput" type="text" placeholder="Message" autocomplete="off">
      <button class="send" id="sendBtn" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </div>

  <!-- AUTH -->
  <div class="screen auth open" id="auth">
    <form class="auth-card" id="authForm">
      <span class="logo big"><i class="fa-solid fa-sun"></i></span>
      <h2>SUNLIGHT</h2>
      <p id="authSub">Log in to continue</p>
      <label hidden id="nameWrap"><input id="authName" type="text" placeholder="Your name" maxlength="40" autocomplete="name"></label>
      <label hidden id="emailWrap"><input id="authEmail" type="email" placeholder="Email (optional)" maxlength="100" autocomplete="email"></label>
      <label><input id="authUser" type="text" placeholder="Username or email" maxlength="100" autocomplete="username" autocapitalize="none" required></label>
      <label><input id="authPass" type="password" placeholder="Password" autocomplete="current-password" required></label>
      <p class="auth-err" id="authErr"></p>
      <button class="auth-btn" id="authBtn"><span class="spin" aria-hidden="true"></span><span id="authBtnTxt">Log in</span></button>
      <button type="button" class="auth-switch" id="authSwitch">New here? Create an account</button>
    </form>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#075B42', '#0E7C5A', '#8A6D0B', '#2F6F8F', '#6B4E9B', '#B5533C'];

let token = localStorage.getItem('sl_token'), me = null, chats = [], users = [], current = null;
let filter = 'all', query = '', pollTimer = null, sigChats = '', sigUsers = '', sigMsgs = '';
const favs = new Set(JSON.parse(localStorage.getItem('sl_favs') || '[]'));

/* ---------- API ---------- */
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch((window.SUNLIGHT_API || '') + '/api/' + path, {
      method: opts.body ? 'POST' : (opts.method || 'GET'),
      headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  } catch { throw new Error('Cannot reach the server. Check your internet connection.'); }
  const data = await res.json().catch(() => null);
  if (!data) throw new Error(`Unexpected server response (HTTP ${res.status}). Make sure the Worker is deployed.`);
  if (res.status === 401 && token && path !== 'login' && path !== 'register') logout(true);
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

/* ---------- Helpers ---------- */
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const avatar = (p, extra = '', dot = false) =>
  `<div class="avatar ${extra}" style="background:${COLORS[p.id % COLORS.length]}"><span>${esc(initials(p.name))}</span>${dot && p.online ? '<i class="dot"></i>' : ''}</div>`;
const tickIcon = t => t ? `<i class="fa-solid fa-check-double tick ${t === 'read' ? 'read' : ''}"></i>` : '';
const clock = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
function fmt(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return clock(ts);
  if (d.toDateString() === new Date(n - 864e5).toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
}
let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
const openScreen = id => $('#' + id).classList.add('open');
const closeScreen = id => $('#' + id).classList.remove('open');
const empty = (icon, text) => `<div class="empty"><i class="${icon}"></i>${text}</div>`;

/* ---------- Auth ---------- */
let mode = 'login';
function setMode(m) {
  mode = m;
  $('#nameWrap').hidden = m === 'login';
  $('#emailWrap').hidden = m === 'login';
  $('#authUser').placeholder = m === 'login' ? 'Username or email' : 'Username';
  $('#authSub').textContent = m === 'login' ? 'Log in to continue' : 'Create your SUNLIGHT account';
  $('#authBtnTxt').textContent = m === 'login' ? 'Log in' : 'Create account';
  $('#authSwitch').textContent = m === 'login' ? 'New here? Create an account' : 'Already have an account? Log in';
  $('#authPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#authErr').textContent = '';
}
$('#authSwitch').addEventListener('click', () => setMode(mode === 'login' ? 'register' : 'login'));
let busy = false;
function setBusy(on) {
  busy = on;
  const b = $('#authBtn');
  b.disabled = on; b.classList.toggle('loading', on); b.setAttribute('aria-busy', on);
  $$('#authForm input').forEach(i => i.disabled = on);
  $('#authSwitch').disabled = on;
  $('#authBtnTxt').textContent = on ? (mode === 'login' ? 'Logging in…' : 'Creating account…') : (mode === 'login' ? 'Log in' : 'Create account');
}
$('#authForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;                                   // ignore repeated clicks while a request is running
  const username = $('#authUser').value.trim(), password = $('#authPass').value;
  const name = $('#authName').value.trim(), email = $('#authEmail').value.trim();
  const err = $('#authErr'); err.textContent = '';
  if (!username || !password) { err.textContent = 'Enter your username (or email) and password'; return; }
  if (mode === 'register' && !name) { err.textContent = 'Enter your name'; return; }
  setBusy(true);
  try {
    const d = await api(mode, { body: mode === 'login' ? { username, password } : { name, username, email, password } });
    token = d.token; localStorage.setItem('sl_token', token);
    $('#authPass').value = '';
    await start(d.user);                              // closes the login screen and shows the Chats home
  } catch (e2) { err.textContent = e2.message; }
  setBusy(false);
});

function logout(silent) {
  if (token && !silent) api('logout', { method: 'POST', body: {} }).catch(() => {});
  token = null; me = null; current = null; chats = []; users = [];
  localStorage.removeItem('sl_token');
  clearInterval(pollTimer); sigChats = sigUsers = sigMsgs = '';
  ['chatScreen', 'newChat'].forEach(closeScreen);
  openScreen('auth'); setMode('login');
}

async function start(user) {
  me = user;
  closeScreen('auth');
  renderProfile();
  await Promise.all([loadChats(), loadUsers()]).catch(() => {});
  showView('chats');
  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 4000);
}

/* ---------- Data loading ---------- */
async function loadChats() {
  const d = await api('chats');
  const next = d.chats.map(c => ({
    id: c.id, name: c.name, online: c.online, unread: c.unread, time: fmt(c.last_at), msg: c.last_body,
    tick: c.last_sender === me.id ? (c.last_read ? 'read' : 'delivered') : null
  }));
  const sig = JSON.stringify(next);
  chats = next;
  if (sig !== sigChats) { sigChats = sig; renderChats(); }
}
async function loadUsers() {
  const d = await api('users');
  const sig = JSON.stringify(d.users);
  users = d.users;
  if (sig !== sigUsers) { sigUsers = sig; renderStories(); renderLists(); }
}
function poll() {
  if (!me) return;
  loadChats().catch(() => {}); loadUsers().catch(() => {});
  if ($('#chatScreen').classList.contains('open')) loadMessages().catch(() => {});
}

/* ---------- Rendering ---------- */
function renderChats() {
  const q = query.trim().toLowerCase();
  const list = chats.filter(c =>
    (filter === 'all' || (filter === 'unread' && c.unread) || (filter === 'fav' && favs.has(c.id))) &&
    (!q || c.name.toLowerCase().includes(q) || c.msg.toLowerCase().includes(q)));
  $('#chatList').innerHTML = list.length ? list.map((c, i) => `
    <div class="row" data-id="${c.id}" style="animation-delay:${Math.min(i, 8) * 30}ms">
      ${avatar(c, '', true)}
      <div class="body">
        <div class="line"><strong>${esc(c.name)}</strong><span class="time ${c.unread ? 'new' : ''}">${esc(c.time)}</span></div>
        <div class="preview"><span class="grow">${tickIcon(c.tick)}<span class="txt">${esc(c.msg)}</span></span>
          ${favs.has(c.id) && !c.unread ? '<i class="fa-solid fa-star fav-ico"></i>' : ''}
          ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>
      </div>
    </div>`).join('')
    : q ? empty('fa-regular fa-comment-dots', `No chats match “${esc(query)}”`)
    : filter === 'group' ? empty('fa-solid fa-user-group', 'Groups are coming soon')
    : filter === 'fav' ? empty('fa-regular fa-star', 'Open a chat and tap the star to add a favorite')
    : filter === 'unread' ? empty('fa-solid fa-check-double', 'You’re all caught up')
    : empty('fa-regular fa-comment-dots', 'No chats yet.<br>Tap the green button to start one.');
  const total = chats.filter(c => c.unread).length;
  const pill = $('#unreadCount');
  pill.textContent = total; pill.classList.toggle('show', total > 0);
}

function renderProfile() {
  const mine = avatar(me, '');
  $('#profileCard').innerHTML = `${mine.replace('class="avatar ', 'class="avatar big ')}<div><strong>${esc(me.name)}</strong><p>@${esc(me.username)}</p></div>`;
  $('#myStatus').innerHTML = `${mine.replace('</div>', '<i class="add-badge fa-solid fa-plus"></i></div>')}<div><strong>My status</strong><p>Tap to add a status update</p></div>`;
  $('#settingsList').innerHTML = [
    ['fa-key', 'Account', '@' + me.username, 'Account'],
    ['fa-bell', 'Notifications', 'Message tones', 'Notifications'],
    ['fa-circle-question', 'Help', 'Help centre, contact us', 'Help'],
    ['fa-right-from-bracket', 'Log out', 'Sign out of this device', '__logout']
  ].map(s => `<div class="set-row" data-set="${s[3]}"><span class="set-ico"><i class="fa-solid ${s[0]}"></i></span><div><strong>${s[1]}</strong><small>${esc(s[2])}</small></div></div>`).join('');
}

function renderStories() {
  const mine = `<div class="story" data-toast="Add status"><div class="avatar" style="background:${COLORS[me.id % COLORS.length]}"><span>${esc(initials(me.name))}</span><i class="add-badge fa-solid fa-plus"></i></div><span class="n">My status</span></div>`;
  $('#stories').innerHTML = mine + users.slice(0, 10).map(u =>
    `<div class="story" data-contact="${u.id}">${avatar(u, `ring ${u.online ? '' : 'seen'}`)}<span class="n">${esc(u.name.split(' ')[0])}</span></div>`).join('');
}

function renderLists() {
  const rows = users.map(u => `
    <div class="row" data-contact="${u.id}">${avatar(u, '', true)}
      <div class="body"><div class="line"><strong>${esc(u.name)}</strong></div>
      <div class="preview">${u.online ? 'Online' : '@' + esc(u.username)}</div></div></div>`).join('');
  const none = empty('fa-solid fa-user-plus', 'No contacts yet.<br>Ask a friend to create a SUNLIGHT account.');
  $('#contactList').innerHTML = rows || none;
  $('#updateList').innerHTML = users.length ? users.map(u => `
    <div class="row" data-toast="${esc(u.name)} has no new status">${avatar(u, `ring ${u.online ? '' : 'seen'}`)}
    <div class="body"><div class="line"><strong>${esc(u.name)}</strong></div><div class="preview">No recent updates</div></div></div>`).join('') : none;
  $('#contactCount').textContent = `${users.length} contact${users.length === 1 ? '' : 's'}`;
}
$('#communityList').innerHTML = empty('fa-solid fa-users', 'Communities are coming soon');
$('#callList').innerHTML = empty('fa-solid fa-phone', 'Voice and video calls are coming soon');

/* ---------- Navigation ---------- */
function showView(name) {
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === name));
  $('#fab').classList.toggle('hide', name !== 'chats');
  $('#main').scrollTop = 0;
  if (name !== 'chats') closeSearch();
}
$('#bottomNav').addEventListener('click', e => { const b = e.target.closest('.nav-item'); if (b) showView(b.dataset.view); });
$('#tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  $$('.tab').forEach(x => x.classList.toggle('active', x === t));
  filter = t.dataset.filter; renderChats();
});

/* ---------- Search ---------- */
function closeSearch() {
  $('#searchbar').classList.remove('open');
  $('#searchInput').value = ''; query = ''; if (me) renderChats();
}
$('#searchBtn').addEventListener('click', () => {
  showView('chats');
  const bar = $('#searchbar');
  if (bar.classList.contains('open')) return closeSearch();
  bar.classList.add('open');
  setTimeout(() => $('#searchInput').focus(), 250);
});
$('#searchClose').addEventListener('click', closeSearch);
$('#searchInput').addEventListener('input', e => { query = e.target.value; renderChats(); });

/* ---------- Menu ---------- */
const menu = $('#menu');
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); menu.classList.toggle('open'); });
document.addEventListener('click', e => { if (!menu.contains(e.target)) menu.classList.remove('open'); });
$('#cameraBtn').addEventListener('click', () => toast('Camera is not available yet'));

function action(act) {
  menu.classList.remove('open');
  if (act === 'settings') { closeScreen('newChat'); showView('settings'); }
  else toast({ group: 'Groups are coming soon', star: 'No starred messages yet', devices: 'No linked devices', contact: 'Contacts appear when friends join', community: 'Communities are coming soon' }[act] || act);
}
$$('[data-act]').forEach(el => el.addEventListener('click', () => action(el.dataset.act)));

document.addEventListener('click', e => {
  const t = e.target.closest('[data-toast]'); if (t) toast(t.dataset.toast);
  const c = e.target.closest('[data-close]'); if (c) closeScreen(c.dataset.close);
  const s = e.target.closest('[data-set]');
  if (s) s.dataset.set === '__logout' ? logout() : toast(s.dataset.set);
});
$('#fab').addEventListener('click', () => { loadUsers().catch(() => {}); openScreen('newChat'); });

/* ---------- Conversation ---------- */
const bubble = m => {
  const out = m.sender_id === me.id;
  return `<div class="msg ${out ? 'out' : 'in'}">${esc(m.body)}<small>${clock(m.created_at)}${out ? tickIcon(m.read_at ? 'read' : 'delivered') : ''}</small></div>`;
};
const scrollDown = () => { const m = $('#messages'); m.scrollTop = m.scrollHeight; };
const updateFav = () => { $('#favBtn i').className = (current && favs.has(current.id) ? 'fa-solid' : 'fa-regular') + ' fa-star'; };

function openChat(id) {
  const p = users.find(u => u.id === +id) || chats.find(c => c.id === +id); if (!p) return;
  current = p; sigMsgs = '';
  $('#chatAvatar').outerHTML = avatar(p, 'sm').replace('class="avatar sm"', 'class="avatar sm" id="chatAvatar"');
  $('#chatName').textContent = p.name;
  $('#chatState').textContent = p.online ? 'online' : 'offline';
  $('#messages').innerHTML = '';
  updateFav(); openScreen('chatScreen'); closeScreen('newChat');
  loadMessages(true).then(loadChats).catch(err => toast(err.message));
}
async function loadMessages(force) {
  if (!current) return;
  const who = current;
  const d = await api('messages?with=' + who.id);
  if (current !== who) return;
  const sig = d.messages.map(m => m.id + (m.read_at ? 'r' : '')).join();
  $('#chatState').textContent = d.online ? 'online' : 'offline';
  if (!force && sig === sigMsgs) return;
  sigMsgs = sig;
  const box = $('#messages'), near = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let lastDay = '';
  box.innerHTML = d.messages.length ? d.messages.map(m => {
    const day = new Date(m.created_at).toDateString(); let h = '';
    if (day !== lastDay) { lastDay = day; h = `<div class="day">${day === new Date().toDateString() ? 'Today' : new Date(m.created_at).toLocaleDateString([], { day: 'numeric', month: 'short' })}</div>`; }
    return h + bubble(m);
  }).join('') : '<div class="day">Say hello 👋</div>';
  if (force || near) scrollDown();
}

$('#chatList').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (r) openChat(r.dataset.id); });
document.addEventListener('click', e => { const r = e.target.closest('[data-contact]'); if (r) openChat(r.dataset.contact); });
$('#favBtn').addEventListener('click', () => {
  if (!current) return;
  favs.has(current.id) ? favs.delete(current.id) : favs.add(current.id);
  localStorage.setItem('sl_favs', JSON.stringify([...favs]));
  updateFav(); renderChats();
  toast(favs.has(current.id) ? 'Added to favorites' : 'Removed from favorites');
});
$('#composer').addEventListener('submit', async e => {
  e.preventDefault();
  const input = $('#msgInput'), body = input.value.trim();
  if (!body || !current) return;
  input.value = '';
  try {
    await api('messages', { body: { to: current.id, body } });
    await loadMessages(true); loadChats();
  } catch (err) { toast(err.message); input.value = body; }
});

/* ---------- Init ---------- */
setMode('login');
if (token) api('me').then(d => start(d.user)).catch(() => logout(true));
</script>
</body>
</html>
