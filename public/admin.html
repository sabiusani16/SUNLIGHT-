<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SUNLIGHT Admin</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("sl_theme")==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
:root,:root[data-theme="light"]{--green:#075B42;--green-d:#054733;--gold:#F5C542;--bg:#E9EFEC;--surface:#fff;--text:#17231F;--muted:#6B7A74;--line:#E3EAE6;--soft:#F4F8F6;--head:#075B42;--accent:#075B42;--danger:#C93B3B;--danger-s:#FCE9E9;--ok:#13804F;--ok-s:#DDF3E8;--shadow:0 4px 18px rgba(7,91,66,.10)}
:root[data-theme="dark"]{--bg:#000;--surface:#131917;--text:#EEF3F0;--muted:#98A8A1;--line:#232C28;--soft:#1A211E;--head:#08130F;--accent:#F5C542;--danger:#FF7B7B;--danger-s:#3A1B1B;--ok:#58D69A;--ok-s:#0E3325;--shadow:0 4px 18px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
.logo{width:36px;height:36px;border-radius:11px;background:var(--green);display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px rgba(245,197,66,.35)}
.top h1{font-size:18px;letter-spacing:.06em;font-weight:800;color:var(--gold)}
.top small{display:block;color:rgba(255,255,255,.7);font-size:12px;letter-spacing:0;font-weight:500}
.top .sp{flex:1}
.top a,.top button.lnk{color:#fff;text-decoration:none;font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.stat{padding:14px 16px}
.stat span{display:block;color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat b{display:block;font-size:28px;margin-top:4px;font-weight:800}
.stat.g b{color:var(--ok)}.stat.r b{color:var(--danger)}.stat.y b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px;padding:12px;margin-bottom:12px;align-items:center}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px;border:1.5px solid transparent}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:11px 0}
.chips{display:flex;gap:6px}
.chip{padding:9px 14px;border-radius:999px;background:var(--soft);font-weight:600;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--green);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{background:var(--gold);color:#1a1a1a}
select{background:var(--soft);border:0;border-radius:12px;padding:10px 12px;font-weight:600}
.list{overflow:hidden}
.hd,.urow{display:grid;grid-template-columns:minmax(0,2.2fr) .7fr 1.3fr 1.2fr .9fr;gap:12px;align-items:center;padding:12px 16px}
.hd{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-bottom:1px solid var(--line)}
.urow{width:100%;text-align:left;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow:hover{background:var(--soft)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who div{min-width:0}
.who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;background:var(--green);overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:22px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.active{background:var(--ok-s);color:var(--ok)}.badge.suspended{background:var(--danger-s);color:var(--danger)}
.muted{color:var(--muted)}
.lbl{display:none;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
@media(max-width:759px){
 .hd{display:none}
 .urow{grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px 16px}
 .urow .who{grid-column:1/-1}
 .lbl{display:block}
 .urow .st{justify-self:start}
}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;flex-wrap:wrap}
.pager button{padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.pager button:disabled{opacity:.4;cursor:default}
.state{padding:40px 20px;text-align:center;color:var(--muted)}
.state b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.state button,.btn{margin-top:14px;padding:11px 18px;border-radius:12px;background:var(--green);color:#fff;font-weight:700}
:root[data-theme=dark] .state button,:root[data-theme=dark] .btn{background:var(--gold);color:#1a1a1a}
:root .btn.danger,:root[data-theme=dark] .btn.danger{background:var(--danger-s);color:var(--danger);border:1px solid var(--danger)}
:root .btn.ok,:root[data-theme=dark] .btn.ok{background:var(--ok-s);color:var(--ok);border:1px solid var(--ok)}
.btn:disabled{opacity:.5}
.sk{height:64px;margin:0;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;justify-content:flex-end}
.scrim[hidden]{display:none}
.panel{background:var(--surface);width:min(440px,100%);height:100%;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:-8px 0 30px rgba(0,0,0,.25)}
@media(max-width:759px){.scrim{align-items:flex-end}.panel{width:100%;height:auto;max-height:92%;border-radius:20px 20px 0 0}}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ph h3{font-size:19px}.ph p{color:var(--muted)}
.x{margin-left:auto;font-size:22px;padding:6px 10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1.4fr;gap:10px 12px;padding:12px 0;border-top:1px solid var(--line)}
.kv span{color:var(--muted)}.kv b{font-weight:600;word-break:break-word}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cnt div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.cnt b{display:block;font-size:19px}.cnt span{font-size:11.5px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16211d;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;max-width:90%;text-align:center}
.toast[hidden]{display:none}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sec h4{font-size:14px;margin-bottom:10px}
.fld{display:block;margin-bottom:10px}.fld span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.fld input{width:100%;background:var(--soft);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;outline:0}
.fld input:focus{border-color:var(--gold)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px;font-size:13.5px}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.pw{display:flex;gap:8px;align-items:center;background:var(--soft);border:1.5px dashed var(--gold);border-radius:12px;padding:12px;margin:10px 0}
.pw code{flex:1;font-size:20px;font-weight:800;letter-spacing:.08em;word-break:break-all}
.pw button{padding:8px 12px;border-radius:10px;background:var(--green);color:#fff;font-weight:700}
:root[data-theme=dark] .pw button{background:var(--gold);color:#1a1a1a}
.logl{font-size:13px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}.logl b{color:var(--text)}
.btn.sm{margin-top:0;padding:9px 14px;font-size:14px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}.tab{padding:10px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tab[aria-selected=true]{background:var(--green);color:#fff;border-color:var(--green)}:root[data-theme=dark] .tab[aria-selected=true]{background:var(--gold);color:#1a1a1a;border-color:var(--gold)}
.tab .n{background:var(--danger);color:#fff;border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:800}.tab .n[hidden]{display:none}
.stats.five{grid-template-columns:repeat(2,1fr)}@media(min-width:760px){.stats.five{grid-template-columns:repeat(5,1fr)}}
.badge.open{background:rgba(245,197,66,.2);color:#B58900}:root[data-theme=dark] .badge.open{color:var(--gold)}.badge.review,.badge.progress{background:rgba(80,150,255,.16);color:#2f6fd0}:root[data-theme=dark] .badge.review,:root[data-theme=dark] .badge.progress{color:#7db4ff}.badge.resolved{background:var(--ok-s);color:var(--ok)}.badge.rejected{background:var(--danger-s);color:var(--danger)}
.rrow{width:100%;text-align:left;display:grid;grid-template-columns:.5fr 1.6fr 1.1fr 1fr .9fr;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.rrow:hover{background:var(--soft)}.rrow:last-child{border-bottom:0}
.rhd{display:grid;grid-template-columns:.5fr 1.6fr 1.1fr 1fr .9fr;gap:12px;padding:12px 16px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;border-bottom:1px solid var(--line)}
.rrow small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rrow strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newdot{display:inline-block;background:var(--gold);color:#1a1a1a;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px;margin-left:6px}
@media(max-width:759px){.rhd{display:none}.rrow{grid-template-columns:1fr 1fr;gap:6px 12px}}
.thr{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px 0 8px}.bub{max-width:88%;padding:9px 12px;border-radius:14px;background:var(--soft);align-self:flex-start;white-space:pre-wrap;word-break:break-word;font-size:14.5px}.bub.adm{background:var(--gold);color:#1a1a1a;align-self:flex-end}.bub small{display:block;font-size:11px;opacity:.7;margin-top:3px}.bub img,.evid{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-top:6px}
.fld textarea,.ta{width:100%;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:80px;font:inherit;color:inherit;resize:vertical}
.quote{background:var(--soft);border-left:3px solid var(--gold);padding:8px 12px;border-radius:8px;white-space:pre-wrap;word-break:break-word;margin:6px 0}
</style>
</head>
<body>
<header class="top">
  <span class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="#F5C542"><circle cx="12" cy="12" r="4.6"/><g stroke="#F5C542" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g></svg></span>
  <h1>SUNLIGHT<small>Admin dashboard</small></h1>
  <span class="sp"></span>
  <a href="/">Back to app</a>
</header>
<main id="main"><div class="state"><b>Loading…</b></div></main>

<div class="scrim" id="scrim" hidden><div class="panel" id="panel" role="dialog" aria-modal="true" aria-label="User details"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const token = (() => { try { return localStorage.getItem('sl_token'); } catch { return null; } })();
let st = { q: '', status: 'all', sort: 'newest', page: 1 }, phoneOn = false, seq = 0, reqN = 0, timer = 0;
async function api(path, body) {
  let res; try { res = await fetch('/api/' + path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined }); }
  catch { const e = new Error('Cannot reach the server. Check your internet connection.'); e.net = true; throw e; }
  const d = await res.json().catch(() => null);
  if (!res.ok) { const e = new Error((d && d.error) || 'Something went wrong'); e.status = res.status; throw e; }
  return d;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : 'Unknown';
const fmtTime = ts => ts ? new Date(ts).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'Unknown';
const COLORS = ['#075B42', '#0F7B5C', '#7A5C00', '#2F6F9F', '#6B4FA0', '#B5532F', '#334155', '#A07800'];
const initials = n => (String(n).trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
const avCache = new Map();
function avatar(u, big) {
  const id = 'av' + (++seq);
  if (u.avatar) setTimeout(async () => {
    try { let url = avCache.get(u.avatar); if (!url) { const d = await api('media/' + encodeURIComponent(u.avatar)); url = 'data:' + d.type + ';base64,' + d.data; avCache.set(u.avatar, url); } const el = document.getElementById(id); if (el) el.insertAdjacentHTML('beforeend', `<img alt="" src="${url}">`); } catch {}
  }, 0);
  return `<span class="av${big ? ' lg' : ''}" id="${id}" style="background:${COLORS[u.id % COLORS.length]}">${esc(initials(u.name || u.username))}</span>`;
}
const badge = s => `<span class="badge ${s}">${s === 'suspended' ? 'Suspended' : 'Active'}</span>`;

/* ---------- gatekeeping ---------- */
async function gate() {
  if (!token) return state('Sign in first', 'Open SUNLIGHT, sign in with your administrator account, then come back to this page.', '<a class="btn" style="display:inline-block;text-decoration:none" href="/">Open SUNLIGHT</a>');
  try { await api('admin/overview'); }
  catch (e) {
    if (e.status === 401) return state('Please sign in again', 'Your session has ended. Sign in to SUNLIGHT, then reopen this page.', '<a class="btn" style="display:inline-block;text-decoration:none" href="/">Open SUNLIGHT</a>');
    if (e.status === 404 || e.status === 403) {
      let id = ''; try { id = (await api('me')).user.id; } catch {}
      return state('Administrators only', 'This account does not have administrator access.' + (id ? ` Your user ID is <b style="display:inline">${esc(id)}</b>. The owner grants access by adding this ID to the <code>ADMIN_USER_IDS</code> setting of the Worker.` : ''));
    }
    return state('Could not load', esc(e.message), '<button id="retry">Try again</button>', () => $('#retry').onclick = gate);
  }
  shell();
}
function state(title, text, extra, hook) { $('#main').innerHTML = `<div class="card state"><b>${esc(title)}</b>${text}${extra || ''}</div>`; if (hook) hook(); }

/* ---------- dashboard ---------- */
let tab = 'users', navTimer = 0, panelPoll = 0;
const TABS = [['users', 'Users'], ['reports', 'Reports'], ['support', 'Support Inbox']];
function shell() {
  $('#main').innerHTML = `<div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" data-tab="${t[0]}" aria-selected="${t[0] === tab}">${t[1]}<span class="n" id="n_${t[0]}" hidden></span></button>`).join('')}</div><div id="view"></div>`;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === b)); showTab(); });
  clearInterval(navTimer); navTimer = setInterval(refreshNav, 15000); showTab();
}
async function refreshNav() {
  try {
    const o = await api('admin/overview');
    const set = (id, n) => { const e = $('#' + id); if (e) { e.textContent = n; e.hidden = !n; } };
    set('n_reports', o.reports_pending); set('n_support', o.support_unread);
    if (tab === 'support' && window.supLoad && o.support_unread !== refreshNav.last && $('#scrim').hidden) window.supLoad();
    if (tab === 'reports' && window.repLoad && o.reports_pending !== refreshNav.lastR && $('#scrim').hidden) window.repLoad();
    refreshNav.lastR = o.reports_pending;
    refreshNav.last = o.support_unread;
  } catch {}
}
function showTab() { refreshNav(); clearTimeout(timer); ++reqN; if (tab === 'users') showUsers(); else if (tab === 'reports') showReports(); else showSupport(); }
function showUsers() {
  $('#view').innerHTML = `
  <h2>Users</h2>
  <div class="stats" id="stats"></div>
  <div class="card bar">
    <label class="search"><span class="sr">Search users</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search username or user ID" autocomplete="off" maxlength="40"></label>
    <div class="chips" role="group" aria-label="Filter by status">
      <button class="chip" data-s="all" aria-pressed="true">All</button><button class="chip" data-s="active" aria-pressed="false">Active</button><button class="chip" data-s="suspended" aria-pressed="false">Suspended</button>
    </div>
    <label><span class="sr">Sort</span><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
  </div>
  <div class="card list" id="list"></div>
  <div class="pager" id="pager"></div>`;
  $('#q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { st.q = e.target.value.trim(); st.page = 1; load(); }, 300); });
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { st.status = c.dataset.s; st.page = 1; document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c)); load(); });
  $('#sort').onchange = e => { st.sort = e.target.value; st.page = 1; load(); };
  loadStats(); load();
}
async function loadStats() {
  try {
    const o = await api('admin/overview'); phoneOn = o.phone_enabled;
    $('#stats').innerHTML = [['Total users', o.total, ''], ['Active', o.active, 'g'], ['Suspended', o.suspended, 'r'], ['New (last 7 days)', o.recent, 'y']].map(([l, v, c]) => `<div class="card stat ${c}"><span>${l}</span><b>${v}</b></div>`).join('');
  } catch (e) { $('#stats').innerHTML = `<div class="card stat" style="grid-column:1/-1"><span>${esc(e.message)}</span></div>`; }
}
async function load() {
  const my = ++reqN, list = $('#list');
  list.innerHTML = '<div class="sk"></div>'.repeat(5); $('#pager').innerHTML = '';
  try {
    const qs = new URLSearchParams({ q: st.q, status: st.status, sort: st.sort, page: st.page, per: 20 });
    const d = await api('admin/users?' + qs); if (my !== reqN) return;   // a newer search already started
    phoneOn = d.phone_enabled;
    if (!d.users.length) { list.innerHTML = `<div class="state"><b>${st.q || st.status !== 'all' ? 'No users match' : 'No users yet'}</b>${st.q || st.status !== 'all' ? 'Try a different search or filter.' : 'Accounts will appear here as people register.'}</div>`; return pager(d); }
    list.innerHTML = `<div class="hd"><span>User</span><span>ID</span><span>Phone</span><span>Registered</span><span>Status</span></div>` + d.users.map(u => `
      <button class="urow" data-id="${u.id}" aria-label="Open ${esc(u.username)}">
        <span class="who">${avatar(u)}<div><strong>@${esc(u.username)}</strong><small>${esc(u.name)}</small></div></span>
        <span><span class="lbl">ID</span>${u.id}</span>
        <span><span class="lbl">Phone</span>${u.phone ? esc(u.phone) : '<span class="muted">' + 'Not added' + '</span>'}</span>
        <span><span class="lbl">Registered</span>${fmtDate(u.created_at)}</span>
        <span class="st"><span class="lbl">Status</span>${badge(u.status)}</span>
      </button>`).join('');
    pager(d);
  } catch (e) {
    if (my !== reqN) return;
    list.innerHTML = `<div class="state"><b>Could not load users</b>${esc(e.message)}<br><button id="retry">Try again</button></div>`; $('#retry').onclick = load;
  }
}
function pager(d) {

    $('#repB').onclick = async () => {
      const b = $('#repB'), text = $('#rep').value.trim(); if (!text && !repImg) return; b.disabled = true;
      try { await api('admin/support/reply', { id: r.id, body: text, media_key: repImg || undefined }); repImg = null; toast('Reply sent'); openThread(r.id, true); supLoad(); refreshNav(); } catch (er) { toast(er.message); b.disabled = false; }
    };
    p.querySelectorAll('[data-ss]').forEach(b => b.onclick = async () => { b.disabled = true; try { await api('admin/support/status', { id: r.id, status: b.dataset.ss }); toast('Status updated'); openThread(r.id, true); supLoad(); } catch (er) { toast(er.message); b.disabled = false; } });
    $('#usrB').onclick = () => openUser(r.user.id);
    clearInterval(panelPoll); panelPoll = setInterval(() => openThread(id, false), 8000);
    refreshNav();
  } catch (e) { if (first) { p.innerHTML = `<div class="ph"><h3>Could not load</h3><button class="x" id="cl">×</button></div><p class="muted">${esc(e.message)}</p>`; $('#cl').onclick = closeP; } }
}

gate();
</script>
</body>
</html>
