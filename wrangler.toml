name = "sunlight"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Shows Worker errors in Cloudflare dashboard > Workers > sunlight > Logs
[observability]
enabled = true

# Static app: public/index.html (HTML + CSS + JS in one file)
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 database (binding name MUST stay "DB")
[[d1_databases]]
binding = "DB"
database_name = "sunlight-chat"
database_id = "14778838-61d9-4fd5-a6be-a7d778348def"

# ---- Cloudflare R2 (videos) ------------------------------------------------
# Videos need an R2 bucket. The app works WITHOUT this: the Video buttons stay
# hidden until the binding exists. To turn videos on:
#   1. Cloudflare dashboard > Storage & Databases > R2 > Create bucket "sunlight-media"
#      (R2 asks for a payment method; the free tier is 10 GB, you pay only above it)
#   2. Remove the leading "# " from the 3 lines below, commit, let it deploy.
# Do NOT enable these lines before the bucket exists, or the deploy will fail.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "sunlight-media"

# ---- Voice/video calls: TURN (REQUIRED for most phone-to-phone calls on mobile data) ----
# Two phones on different mobile networks usually cannot reach each other
# directly (carrier NAT). The call then stays on "Connecting..." until a TURN
# relay is available. Pick ONE of these (the Worker uses the first that works):
#
# OPTION A - Cloudflare TURN (1,000 GB/month free, then $0.05/GB):
#   1. Cloudflare dashboard > Realtime > TURN Server > Create a TURN key
#      (copy the Key ID and the API token; if the page asks for a card, use B)
#   2. Workers & Pages > sunlight > Settings > Variables and Secrets > add 2 SECRETS:
#        TURN_KEY_ID         = <the Key ID>
#        TURN_KEY_API_TOKEN  = <the API token>
#
# OPTION B - Metered.ca (free plan: 500 MB/month, no credit card):
#   1. Sign up at https://www.metered.ca > create an app. Note the app name
#      (the part before .metered.live) and copy an API key from the dashboard.
#   2. Add 2 SECRETS in the same place:
#        METERED_APP      = <app name, e.g. sunlight>
#        METERED_API_KEY  = <the API key>
#
# After adding the secrets, redeploy. During a call the small line under the
# call status must say "TURN on". Never write these values into this file or GitHub.

# ---- Optional: email verification for "Change email" (Settings -> Account) ----
# Without these two secrets the email cannot be changed (the app says so; nothing is faked).
# Create a Resend account (resend.com), verify a sending domain, then add as Worker secrets
# (Settings -> Variables and secrets -> type "Secret", Runtime):
#   RESEND_API_KEY = your Resend API key
#   MAIL_FROM      = SUNLIGHT <no-reply@your-verified-domain>

# ---- SMS sign-in (phone number + OTP) ----
# Real SMS needs ONE provider. Add its secrets (never put them in this file):
#   Twilio : npx wrangler secret put TWILIO_ACCOUNT_SID ; TWILIO_AUTH_TOKEN ; and TWILIO_FROM (your Twilio number, E.164)
#            OR TWILIO_MESSAGING_SERVICE_SID instead of TWILIO_FROM
#   Termii : npx wrangler secret put TERMII_API_KEY ; TERMII_BASE_URL (the base URL shown in YOUR Termii dashboard) ; TERMII_SENDER_ID
#            optional TERMII_CHANNEL (default "dnd", which delivers to Nigerian numbers on DND)
# Recommended: npx wrangler secret put OTP_PEPPER   (any long random string; makes stored code hashes un-guessable)
# Optional: LEGACY_LOGIN=0 (as a plain var) disables the old-password sign-in once all users have added a phone.
# Without a provider the app answers "SMS sign-in is not set up" and sends nothing. /api/health shows "sms": true/false.
