name = "sunlight"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Shows Worker errors in Cloudflare dashboard > Workers > sunlight > Logs
[observability]
enabled = true

# Static app: public/index.html (HTML + CSS + JS in one file)
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 database (binding name MUST stay "DB")
[[d1_databases]]
binding = "DB"
database_name = "sunlight-chat"
database_id = "14778838-61d9-4fd5-a6be-a7d778348def"

# ---- Cloudflare R2 (videos) ------------------------------------------------
# Videos need an R2 bucket. The app works WITHOUT this: the Video buttons stay
# hidden until the binding exists. To turn videos on:
#   1. Cloudflare dashboard > Storage & Databases > R2 > Create bucket "sunlight-media"
#      (R2 asks for a payment method; the free tier is 10 GB, you pay only above it)
#   2. Remove the leading "# " from the 3 lines below, commit, let it deploy.
# Do NOT enable these lines before the bucket exists, or the deploy will fail.
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "sunlight-media"

# ---- Voice calls: TURN (optional but strongly recommended) ------------------
# Calls work without any setup on most networks (STUN is built in). On some
# mobile networks the audio can only get through a TURN relay. To enable it:
#   1. Cloudflare dashboard > Realtime > TURN Server > Create a TURN key
#      (copy the Key ID and the API token)
#   2. Workers & Pages > sunlight > Settings > Variables and Secrets > add TWO secrets:
#        TURN_KEY_ID         = <the Key ID>
#        TURN_KEY_API_TOKEN  = <the API token>
#   3. Redeploy. The app then asks Cloudflare for short-lived credentials per call.
# Never write these two values into this file or into GitHub.
